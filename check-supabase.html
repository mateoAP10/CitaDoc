<!doctype html><html><head><meta charset="UTF-8"><title>CitaDoc — Diagnóstico Supabase</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{font-family:monospace;padding:2rem;background:#0f1a18;color:#e0f5f2}.ok{color:#4ade80}.err{color:#f87171}.warn{color:#fbbf24}pre{background:#1a2e2b;padding:1rem;border-radius:8px;overflow-x:auto;font-size:.85rem}h2{color:#0e9d8c;margin-top:1.5rem}</style></head><body><h1>🔍 CitaDoc — Diagnóstico Supabase</h1><div id="output"></div><script>const SUPABASE_URL="https://qxoomcqaafogczrvsyhg.supabase.co",SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b29tY3FhYWZvZ2N6cnZzeWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDAyMzgsImV4cCI6MjA5Mjk3NjIzOH0.HRer4Z0vx1sNbxpZelIiHOqdGwSgpykEOZM5p2To2Vs",_supabase=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),out=document.getElementById("output"),log=(e,o="")=>{out.innerHTML+=`<p class="${o}">${e}</p>`},pre=e=>{out.innerHTML+=`<pre>${JSON.stringify(e,null,2)}</pre>`};async function diagnose(){log("<h2>1. SessionStorage</h2>");const e=sessionStorage.getItem("citadoc_user");if(e){const o=JSON.parse(e);log(`✅ Datos en sessionStorage: ${o.titulo||"Dr."} ${o.nombre} ${o.apellido}`,"ok"),log(`   Slug: ${o.slug||"SIN SLUG"}`,o.slug?"ok":"err"),log(`   Especialidades: ${(o.especialidades||[]).join(", ")||"vacío"}`,o.especialidades?.length?"ok":"warn")}else log("❌ No hay datos en sessionStorage — el médico no ha iniciado sesión en esta sesión del browser","err");log("<h2>2. Sesión Supabase Auth</h2>");const{data:{session:o},error:s}=await _supabase.auth.getSession();if(s)log("❌ Error getSession: "+s.message,"err");else if(o){log(`✅ Sesión activa: ${o.user.email}`,"ok"),log(`   user_id: ${o.user.id}`,"ok"),log("<h2>3. Perfil en tabla medicos</h2>");const{data:e,error:s}=await _supabase.from("medicos").select("*").eq("user_id",o.user.id).single();if(s?(log("❌ Error buscando médico: "+s.message,"err"),log("   CAUSA: El registro médico no se guardó en la tabla medicos","warn"),log("   SOLUCIÓN: Regístrate de nuevo en citadoc-registro.html","warn")):(log(`✅ Médico encontrado: ${e.titulo} ${e.nombre} ${e.apellido}`,"ok"),log(`   Slug: ${e.slug}`,"ok"),log(`   Ciudad: ${e.ciudad}`,"ok"),log(`   Plan: ${e.plan}`,"ok"),pre(e)),log("<h2>4. Citas en DB</h2>"),e){const{data:o,count:s}=await _supabase.from("citas").select("*",{count:"exact"}).eq("medico_id",e.id);log(`Citas totales: ${s||0}`,s>0?"ok":"warn")}}else log("❌ No hay sesión activa — necesitas iniciar sesión primero","err");log("<h2>✅ Diagnóstico completo</h2>")}diagnose()</script></body></html>
