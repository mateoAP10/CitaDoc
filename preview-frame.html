<body>
  <main id="dna-main"></main>
  <script>
    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'CITADOC_RENDER') return;
      var d = e.data;
      console.log('[Preview] gallery:', d.config && d.config.gallery && d.config.gallery.length, '| show_carousel:', d.ws && d.ws.show_carousel);
      if (typeof window.renderWebsite !== 'function') return;
      // Clean previous render
      var main = document.getElementById('dna-main');
      if (main) main.innerHTML = '';
      ['_cd-legacy-hide','_cd-dna-override','_cd-ws-post'].forEach(function(id) {
        var s = document.getElementById(id);
        if (s && s.parentNode) s.parentNode.removeChild(s);
      });
      document.body.style.paddingTop = '0';
      window.renderWebsite(d.doctor, d.locs || [], d.config, true, d.ws || {});
    });
  </script>
</body>
