<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nueva contraseña — CitaDoc</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f1f5f9;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#fff;border-radius:24px;padding:2.5rem 2.2rem;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(15,26,24,.10)}
.logo{text-align:center;margin-bottom:2rem}
.logo-icon{width:60px;height:60px;background:linear-gradient(135deg,#085f54,#0b7c6e);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem;font-size:1.6rem;color:#fff;font-weight:800;line-height:1}
.logo-name{font-size:.75rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#0f1a18}
h1{font-size:1.4rem;font-weight:700;color:#0f1a18;margin-bottom:.35rem;text-align:center}
.sub{font-size:.85rem;color:#6b7c79;text-align:center;margin-bottom:1.8rem}
label{font-size:.8rem;font-weight:600;color:#374151;display:block;margin-bottom:.4rem}
.input-wrap{position:relative;margin-bottom:1rem}
.input-wrap input{width:100%;padding:.8rem 2.8rem .8rem 1rem;border:1.5px solid #e5e7eb;border-radius:12px;font-size:.92rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.input-wrap input:focus{border-color:#0b7c6e}
.eye-btn{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;padding:.2rem;line-height:1;transition:color .15s}
.eye-btn:hover{color:#374151}
.strength-bar{height:4px;border-radius:4px;background:#e5e7eb;margin-top:-.5rem;margin-bottom:.9rem;overflow:hidden}
.strength-fill{height:100%;border-radius:4px;transition:width .3s,background .3s;width:0}
.strength-label{font-size:.73rem;color:#9ca3af;margin-top:.3rem;margin-bottom:.8rem;min-height:1rem;text-align:right}
.btn{width:100%;padding:.9rem;background:#0b7c6e;color:#fff;border:none;border-radius:13px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s;margin-top:.25rem}
.btn:hover{background:#085f54}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:.82rem;padding:.75rem 1rem;border-radius:10px;margin-bottom:1rem;display:none}
.msg.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.msg.ok{background:#f0fdf4;color:#166534;border:1px solid #86efac}
.back{display:block;text-align:center;margin-top:1.2rem;font-size:.82rem;color:#6b7c79;text-decoration:none}
.back:hover{color:#0b7c6e}
.loading{text-align:center;color:#6b7c79;font-size:.9rem;padding:2rem 0}
</style>
</head>
<body>

<div class="card" id="cardMain" style="display:none">
  <div class="logo">
    <div class="logo-icon">C</div>
    <div class="logo-name">CitaDoc</div>
  </div>
  <h1>Nueva contraseña</h1>
  <p class="sub">Elige una contraseña segura para tu cuenta</p>

  <div id="msg" class="msg"></div>

  <label for="pass1">Nueva contraseña</label>
  <div class="input-wrap">
    <input type="password" id="pass1" placeholder="Mínimo 8 caracteres" autocomplete="new-password" oninput="checkStrength(this.value)">
    <button class="eye-btn" type="button" onclick="toggleEye('pass1',this)" tabindex="-1">
      <svg id="eye1" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
  <div class="strength-label" id="strengthLabel"></div>

  <label for="pass2">Confirmar contraseña</label>
  <div class="input-wrap">
    <input type="password" id="pass2" placeholder="Repite la contraseña" autocomplete="new-password">
    <button class="eye-btn" type="button" onclick="toggleEye('pass2',this)" tabindex="-1">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <button class="btn" id="btnSave" onclick="guardarPassword()">Guardar nueva contraseña →</button>
  <a href="index.html" class="back">← Volver al inicio</a>
</div>

<div class="card" id="cardLoading">
  <div class="logo">
    <div class="logo-icon">C</div>
    <div class="logo-name">CitaDoc</div>
  </div>
  <div class="loading">Verificando enlace…</div>
</div>

<div class="card" id="cardInvalid" style="display:none">
  <div class="logo">
    <div class="logo-icon" style="background:#dc2626">!</div>
    <div class="logo-name">CitaDoc</div>
  </div>
  <h1 style="color:#dc2626">Enlace inválido</h1>
  <p class="sub" style="margin-bottom:1.5rem">Este enlace ya fue usado o expiró. Solicita uno nuevo.</p>
  <a href="index.html" class="btn" style="display:block;text-align:center;text-decoration:none">Volver al inicio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var _sb = supabase.createClient(
  "https://qxoomcqaafogczrvsyhg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b29tY3FhYWZvZ2N6cnZzeWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDAyMzgsImV4cCI6MjA5Mjk3NjIzOH0.HRer4Z0vx1sNbxpZelIiHOqdGwSgpykEOZM5p2To2Vs"
);

function show(id) {
  ["cardMain","cardLoading","cardInvalid"].forEach(function(i){
    document.getElementById(i).style.display = i===id ? "block" : "none";
  });
}

function showMsg(text, type) {
  var m = document.getElementById("msg");
  m.textContent = text;
  m.className = "msg " + type;
  m.style.display = "block";
}

function toggleEye(inputId, btn) {
  var inp = document.getElementById(inputId);
  var isPass = inp.type === "password";
  inp.type = isPass ? "text" : "password";
  btn.style.color = isPass ? "#0b7c6e" : "#9ca3af";
}

function checkStrength(val) {
  var fill = document.getElementById("strengthFill");
  var label = document.getElementById("strengthLabel");
  if (!val) { fill.style.width = "0"; label.textContent = ""; return; }
  var score = 0;
  if (val.length >= 8)  score++;
  if (val.length >= 12) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  var levels = [
    {w:"20%", bg:"#ef4444", txt:"Muy débil"},
    {w:"40%", bg:"#f97316", txt:"Débil"},
    {w:"60%", bg:"#eab308", txt:"Regular"},
    {w:"80%", bg:"#22c55e", txt:"Buena"},
    {w:"100%",bg:"#16a34a", txt:"Excelente"}
  ];
  var l = levels[Math.min(score, 4)];
  fill.style.width = l.w;
  fill.style.background = l.bg;
  label.textContent = l.txt;
  label.style.color = l.bg;
}

_sb.auth.onAuthStateChange(function(event, session) {
  if (event === "PASSWORD_RECOVERY") { show("cardMain"); }
});

var _timeout = setTimeout(function() { show("cardInvalid"); }, 4000);

_sb.auth.getSession().then(function(res) {
  if (res.data && res.data.session) { clearTimeout(_timeout); show("cardMain"); }
});

async function guardarPassword() {
  var p1 = document.getElementById("pass1").value;
  var p2 = document.getElementById("pass2").value;
  var btn = document.getElementById("btnSave");

  if (p1.length < 8) { showMsg("La contraseña debe tener al menos 8 caracteres.", "error"); return; }
  if (p1 !== p2)      { showMsg("Las contraseñas no coinciden.", "error"); return; }

  btn.disabled = true;
  btn.textContent = "Guardando…";

  var r = await _sb.auth.updateUser({ password: p1 });

  if (r.error) {
    showMsg("Error: " + r.error.message, "error");
    btn.disabled = false;
    btn.textContent = "Guardar nueva contraseña →";
  } else {
    showMsg("✓ Contraseña actualizada. Redirigiendo…", "ok");
    btn.style.display = "none";
    setTimeout(function() { window.location.href = "citadoc-dashboard.html"; }, 1800);
  }
}
</script>
</body>
</html>
