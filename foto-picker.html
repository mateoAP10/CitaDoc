<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Picker fotos doctores</title><style>body{margin:0;background:#0a0f0d;font-family:sans-serif;padding:2rem}h1{color:#fff;margin-bottom:1.5rem;font-size:1.2rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}.item{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:border-color .2s}.item:hover{border-color:#2d7a55}.item.selected{border-color:#4ade80}.item img{width:100%;height:280px;object-fit:cover;display:block}.item .lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#fff;padding:.4rem .6rem;font-size:.75rem}.item .num{position:absolute;top:.5rem;left:.5rem;background:#1e4d34;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}#result{margin-top:1.5rem;padding:1rem;background:rgba(255,255,255,.06);border-radius:10px;color:#4ade80;font-size:.85rem;min-height:2rem}button{margin-top:1rem;padding:.6rem 1.2rem;background:#1e4d34;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem}</style></head><body><h1>Selecciona las fotos que se ven como doctores atractivos y premium 👇</h1><div class="grid" id="grid"></div><button onclick="mostrar()">Ver seleccionados</button><div id="result"></div><script>var PHOTOS=["photo-1559757175-0eb30cd8c063","photo-1582750433449-648ed127bb54","photo-1527613426441-4da17471b66d","photo-1622253692010-333f2da6031d","photo-1622902046580-2b47f47f5471","photo-1537368910025-700350fe46c7","photo-1631815588090-d4bfec5b1ccb","photo-1651008376811-b90baee60c1f","photo-1666214280557-f1b5022eb634","photo-1643297654416-05795d62e39c","photo-1638202993928-7267aad84c31","photo-1614608682850-e0d6ed316d47","photo-1594824476967-48c8b964273f","photo-1551884170-09fb70a3a2ed","photo-1607613009820-a29f7bb81c04","photo-1559839734-2b71ea197ec2","photo-1612349317150-e413f6a5b16d"],selected=new Set,grid=document.getElementById("grid");function mostrar(){var e=document.getElementById("result");0!==selected.size?e.innerHTML="<strong>IDs seleccionados — pásalos al arquitecto:</strong><br>"+Array.from(selected).map(function(e){return'"'+e+'"'}).join("<br>"):e.textContent="No seleccionaste nada"}PHOTOS.forEach(function(e,o){var t=document.createElement("div");t.className="item",t.innerHTML='<div class="num">'+(o+1)+'</div><img src="https://images.unsplash.com/'+e+'?fit=crop&w=400&h=560&q=80" loading="lazy"><div class="lbl">'+e.slice(-8)+"</div>",t.onclick=function(){selected.has(e)?(selected.delete(e),t.classList.remove("selected")):(selected.add(e),t.classList.add("selected"))},grid.appendChild(t)})</script></body></html>
