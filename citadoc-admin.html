<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CitaDoc Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #0a0f1a; color: #e2e8f0; min-height: 100svh; }

  /* Login */
  #loginScreen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100svh; padding: 1.5rem;
  }
  .login-card {
    background: #0f172a; border: 1px solid #1e293b; border-radius: 20px;
    padding: 2.5rem; width: 100%; max-width: 360px;
  }
  .login-card h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .3rem; }
  .login-card p { font-size: .82rem; color: #475569; margin-bottom: 1.8rem; }
  .login-card input {
    width: 100%; padding: .75rem 1rem; background: #1e293b; border: 1.5px solid #334155;
    border-radius: 10px; color: #e2e8f0; font-size: .9rem; font-family: inherit;
    outline: none; margin-bottom: 1rem;
  }
  .login-card input:focus { border-color: #7c3aed; }
  .btn-primary {
    width: 100%; padding: .8rem; background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: #fff; border: none; border-radius: 10px; font-size: .9rem; font-weight: 700;
    font-family: inherit; cursor: pointer;
  }
  #loginError { color: #f87171; font-size: .8rem; margin-top: .6rem; display: none; }

  /* Main */
  #mainApp { display: none; }
  .topbar {
    background: #0f172a; border-bottom: 1px solid #1e293b;
    padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-logo { font-size: .75rem; font-weight: 700; letter-spacing: .12em; color: #7c3aed; text-transform: uppercase; }
  .topbar-title { font-size: .85rem; color: #475569; }
  .logout-btn {
    background: none; border: 1px solid #334155; color: #94a3b8; padding: .35rem .9rem;
    border-radius: 8px; font-size: .78rem; cursor: pointer; font-family: inherit;
  }

  .main-content { padding: 1.5rem; max-width: 900px; margin: 0 auto; }

  .section-title {
    font-size: .65rem; font-weight: 700; color: #7c3aed; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 1rem;
  }

  /* Tabs */
  .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  .tab {
    padding: .45rem 1rem; border-radius: 8px; font-size: .8rem; font-weight: 600;
    cursor: pointer; border: 1.5px solid #1e293b; color: #475569; background: transparent;
    font-family: inherit; transition: all .15s;
  }
  .tab.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  .tab-count {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; background: rgba(255,255,255,.15); border-radius: 50%;
    font-size: .65rem; font-weight: 700; margin-left: .4rem;
  }
  .tab.active .tab-count { background: rgba(255,255,255,.25); }

  /* Cards */
  .card-list { display: flex; flex-direction: column; gap: 1rem; }
  .med-card {
    background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 1.4rem;
  }
  .med-card.estado-verificado { border-color: #065f46; }
  .med-card.estado-rechazado  { border-color: #7f1d1d; }

  .med-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .med-name   { font-size: 1rem; font-weight: 700; color: #f1f5f9; }
  .med-email  { font-size: .78rem; color: #475569; margin-top: .2rem; }
  .med-esp    { font-size: .75rem; color: #334155; margin-top: .15rem; }

  .badge {
    display: inline-flex; align-items: center; padding: .3rem .8rem;
    border-radius: 100px; font-size: .7rem; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; white-space: nowrap;
  }
  .badge-revision  { background: #451a03; color: #fb923c; }
  .badge-verificado{ background: #052e16; color: #4ade80; }
  .badge-rechazado { background: #450a0a; color: #f87171; }

  .doc-links { margin-top: 1.1rem; display: flex; gap: .7rem; flex-wrap: wrap; }
  .doc-link {
    display: inline-flex; align-items: center; gap: .4rem; padding: .45rem 1rem;
    background: #1e293b; border: 1px solid #334155; border-radius: 8px;
    color: #818cf8; font-size: .78rem; font-weight: 600; text-decoration: none;
    transition: background .15s;
  }
  .doc-link:hover { background: #293548; }

  .actions { margin-top: 1.2rem; display: flex; gap: .7rem; flex-wrap: wrap; }
  .btn-approve {
    padding: .55rem 1.2rem; background: #059669; color: #fff; border: none;
    border-radius: 9px; font-size: .82rem; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: opacity .15s;
  }
  .btn-approve:hover { opacity: .88; }
  .btn-reject {
    padding: .55rem 1.2rem; background: transparent; color: #f87171;
    border: 1.5px solid #7f1d1d; border-radius: 9px; font-size: .82rem;
    font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity .15s;
  }
  .btn-reject:hover { opacity: .75; }
  .btn-done { padding: .55rem 1rem; background: #1e293b; color: #475569; border: none; border-radius: 9px; font-size: .78rem; cursor: default; font-family: inherit; }

  .empty { text-align: center; padding: 3rem 1rem; color: #334155; }
  .empty-icon { font-size: 2.5rem; margin-bottom: .8rem; }

  #toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: .7rem 1.2rem; font-size: .82rem; font-weight: 600; color: #e2e8f0;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 999; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div style="font-size:.65rem;font-weight:700;color:#7c3aed;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1.2rem">CitaDoc · Admin</div>
    <h1>Verificaciones</h1>
    <p>Acceso restringido al equipo CitaDoc</p>
    <input type="password" id="tokenInput" placeholder="Token de acceso" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-primary" onclick="doLogin()">Entrar →</button>
    <div id="loginError">Token incorrecto</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">
  <div class="topbar">
    <div>
      <div class="topbar-logo">CitaDoc Admin</div>
      <div class="topbar-title">Verificaciones médicas</div>
    </div>
    <button class="logout-btn" onclick="doLogout()">Salir</button>
  </div>

  <div class="main-content">
    <div class="tabs" id="tabsRow"></div>
    <div id="listContainer"><div class="empty"><div class="empty-icon">⏳</div><div>Cargando...</div></div></div>
  </div>
</div>

<div id="toast"></div>

<script>
const ADMIN_URL = 'https://qxoomcqaafogczrvsyhg.supabase.co/functions/v1/admin-verify';
let adminToken  = '';
let allDocs     = [];
let activeTab   = 'en_revision';

function doLogin() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  adminToken = t;
  loadVerifications();
}

function doLogout() {
  adminToken = '';
  document.getElementById('mainApp').style.display   = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('tokenInput').value = '';
}

async function loadVerifications() {
  try {
    const res = await fetch(ADMIN_URL, { headers: { 'x-admin-token': adminToken } });
    if (res.status === 401) {
      document.getElementById('loginError').style.display = 'block';
      return;
    }
    const { data } = await res.json();
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display    = 'block';
    allDocs = data || [];
    renderTabs();
    renderList();
  } catch(e) {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginError').textContent   = 'Error de conexión';
  }
}

function renderTabs() {
  const counts = { en_revision: 0, verificado: 0, rechazado: 0 };
  allDocs.forEach(d => { if (counts[d.verificacion_estado] !== undefined) counts[d.verificacion_estado]++; });

  const tabs = [
    { key: 'en_revision',  label: 'Pendientes' },
    { key: 'verificado',   label: 'Aprobados' },
    { key: 'rechazado',    label: 'Rechazados' },
  ];

  document.getElementById('tabsRow').innerHTML = tabs.map(t => `
    <button class="tab ${activeTab===t.key?'active':''}" onclick="switchTab('${t.key}')">
      ${t.label}<span class="tab-count">${counts[t.key]}</span>
    </button>
  `).join('');
}

function switchTab(tab) {
  activeTab = tab;
  renderTabs();
  renderList();
}

function renderList() {
  const filtered = allDocs.filter(d => d.verificacion_estado === activeTab);
  const container = document.getElementById('listContainer');

  if (!filtered.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">${activeTab==='en_revision'?'✅':'📋'}</div><div>No hay médicos en esta categoría</div></div>`;
    return;
  }

  container.innerHTML = `<div class="card-list">${filtered.map(m => renderCard(m)).join('')}</div>`;
}

function renderCard(m) {
  const esp = (m.especialidades||[])[0] || '';
  const estado = m.verificacion_estado;
  const badgeCls = estado === 'verificado' ? 'badge-verificado' : estado === 'rechazado' ? 'badge-rechazado' : 'badge-revision';
  const badgeTxt = estado === 'verificado' ? 'Verificado' : estado === 'rechazado' ? 'Rechazado' : 'En revisión';

  const docLinks = `
    ${m.cedula_doc_url ? `<a href="${m.cedula_doc_url}" target="_blank" class="doc-link">🪪 Documento de identidad</a>` : '<span style="color:#334155;font-size:.78rem">Sin doc. identidad</span>'}
    ${m.titulo_doc_url ? `<a href="${m.titulo_doc_url}" target="_blank" class="doc-link">📄 Título médico</a>` : '<span style="color:#334155;font-size:.78rem">Sin título</span>'}
  `;

  const actions = estado === 'en_revision'
    ? `<button class="btn-approve" onclick="takeAction('${m.id}','aprobar',this)">✓ Aprobar</button>
       <button class="btn-reject"  onclick="takeAction('${m.id}','rechazar',this)">✕ Rechazar</button>`
    : `<span class="btn-done">${estado === 'verificado' ? '✓ Aprobado' : '✕ Rechazado'}</span>`;

  return `<div class="med-card estado-${estado}" id="card-${m.id}">
    <div class="med-header">
      <div>
        <div class="med-name">${m.titulo||'Dr.'} ${m.nombre||''} ${m.apellido||''}</div>
        <div class="med-email">${m.email||'—'}</div>
        ${esp ? `<div class="med-esp">${esp}</div>` : ''}
      </div>
      <span class="badge ${badgeCls}">${badgeTxt}</span>
    </div>
    <div class="doc-links">${docLinks}</div>
    <div class="actions">${actions}</div>
  </div>`;
}

async function takeAction(medicoId, action, btn) {
  btn.disabled = true;
  btn.textContent = action === 'aprobar' ? 'Aprobando...' : 'Rechazando...';

  try {
    const res = await fetch(ADMIN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken },
      body: JSON.stringify({ medico_id: medicoId, action }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);

    // Update local data
    const idx = allDocs.findIndex(d => d.id === medicoId);
    if (idx !== -1) allDocs[idx].verificacion_estado = json.nuevo_estado;

    showToast(action === 'aprobar' ? '✓ Aprobado — email enviado al médico' : '✕ Rechazado — email enviado al médico');
    renderTabs();
    renderList();
  } catch(e) {
    showToast('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = action === 'aprobar' ? '✓ Aprobar' : '✕ Rechazar';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
