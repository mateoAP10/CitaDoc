<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title id="pgTitle">CitaDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--bg:#FAFBFF;--drawer:#FAFBFF;--ink:#0F172A;--ink2:#334155;--mu:#64748B;--bo:#E2E8F0;--s:#F1F5F9;--accent:#2563EB;--serif:'Fraunces',serif;--sans:'DM Sans',sans-serif}
    html,body{background:var(--bg);font-family:var(--sans);color:var(--ink);overflow-x:hidden}
    .v2-photo{position:fixed;top:0;left:0;right:0;height:60svh;z-index:0;overflow:hidden;background:#111}
    .v2-photo img{width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block;filter:saturate(.95) brightness(1.02)}
    .v2-nav{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(env(safe-area-inset-top,0px)+16px) 20px 0;display:flex;justify-content:space-between;align-items:center}
    .v2-monogram{font-family:var(--serif);font-size:1.1rem;font-weight:600;color:#fff;letter-spacing:-.02em;line-height:1;text-shadow:0 1px 8px rgba(0,0,0,.4)}
    .v2-logo{height:28px;max-width:100px;object-fit:contain;mix-blend-mode:multiply}
    .v2-nav-btn{height:34px;padding:0 .9rem;border-radius:50px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:#fff;font-family:var(--sans);font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap}
    .v2-drawer{position:relative;z-index:10;margin-top:min(56svh,calc(100vw * 1.1));border-radius:20px 20px 0 0;background:var(--drawer);min-height:calc(100svh - 48svh);padding:18px 20px calc(90px + env(safe-area-inset-bottom,0px))}
    .v2-handle{width:32px;height:3px;border-radius:2px;background:var(--bo);margin:0 auto 20px}
    .v2-name{font-family:var(--serif);font-size:clamp(22px,6vw,28px);font-weight:400;color:var(--ink);line-height:1.05;letter-spacing:-.03em;margin-bottom:3px}
    .v2-esp{font-size:.55rem;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.14em;margin-bottom:14px}
    .v2-chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x mandatory;padding:0 20px 14px;margin:0 -20px}
    .v2-chips::-webkit-scrollbar{display:none}
    .v2-chip{flex:0 0 auto;scroll-snap-align:start;height:32px;padding:0 14px;border-radius:100px;border:1.5px solid var(--bo);background:transparent;font-family:var(--sans);font-size:.7rem;font-weight:600;color:var(--mu);white-space:nowrap;cursor:pointer;transition:all .18s}
    .v2-chip.active{background:var(--ink);border-color:var(--ink);color:var(--drawer)}
    .v2-panel{padding-top:2px}
    .v2-panel[hidden]{display:none}
    .v2-about-bio{font-size:13px;color:var(--ink2);line-height:1.75;margin-bottom:16px}
    .v2-about-cta{display:flex;gap:10px;margin-top:4px}
    .v2-btn-book{flex:1;height:48px;border-radius:12px;background:var(--ink);border:none;color:var(--drawer);font-family:var(--sans);font-size:.84rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:opacity .2s}
    .v2-btn-book:hover{opacity:.88}
    .v2-btn-wa{flex:0 0 48px;height:48px;border-radius:12px;border:1.5px solid var(--bo);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;color:var(--ink);transition:background .2s}
    .v2-btn-wa:hover{background:var(--s)}
    .v2-srv-list{display:flex;flex-direction:column}
    .v2-srv-row{display:flex;align-items:center;justify-content:space-between;padding:.85rem 0;border-bottom:.5px solid var(--bo)}
    .v2-srv-row:last-child{border-bottom:none}
    .v2-srv-name{font-size:.9rem;font-weight:600;color:var(--ink)}
    .v2-srv-arr{font-size:.82rem;color:var(--bo)}
    .v2-cred-list{display:flex;flex-direction:column;gap:10px}
    .v2-cred{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink2);line-height:1.5}
    .v2-cred-dot{width:4px;height:4px;border-radius:50%;background:var(--ink);flex-shrink:0;margin-top:.28rem}
    .v2-consult-row{display:flex;align-items:center;justify-content:space-between;padding:.8rem 0;border-bottom:.5px solid var(--bo)}
    .v2-consult-row:last-child{border-bottom:none}
    .v2-consult-label{font-size:.8rem;color:var(--mu);font-weight:500}
    .v2-consult-value{font-size:.86rem;font-weight:700;color:var(--ink)}
    .v2-gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .v2-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;filter:grayscale(40%)}
    .v2-precio-tag{display:none;align-items:center;gap:.4rem;font-size:12px;color:var(--bo);font-weight:500;margin-bottom:12px}
    .v2-precio-dot{width:3px;height:3px;border-radius:50%;background:var(--bo);flex-shrink:0}
    .v2-precio-val{color:var(--mu);font-weight:600}
    .v2-footer{margin-top:22px;padding-top:16px;border-top:.5px solid var(--bo);display:flex;align-items:center;justify-content:center;gap:.4rem}
    .v2-footer-icon{width:17px;height:17px;border-radius:5px;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:.52rem;font-weight:800;color:var(--drawer)}
    .v2-footer-text{font-size:.62rem;color:var(--bo)}
    .v2-footer-text a{color:var(--mu);text-decoration:none;font-weight:600}
    .v2-edit-toggle{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:14px;padding:8px;width:100%;font-size:.65rem;font-weight:600;color:var(--bo);text-transform:uppercase;letter-spacing:.08em;background:none;border:none;cursor:pointer;font-family:var(--sans)}
    .v2-edit-panel{display:none;background:var(--s);border-radius:12px;padding:14px;margin-top:8px}
    .v2-edit-panel.open{display:block}
    .v2-edit-link{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--drawer);border-radius:8px;text-decoration:none;margin-bottom:6px}
    .v2-edit-link span:first-child{font-size:13px;font-weight:600;color:var(--ink2)}
    .v2-edit-link span:last-child{font-size:11px;color:var(--mu)}
    .v2-bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--drawer);border-top:1px solid var(--bo);padding:9px 0 calc(env(safe-area-inset-bottom,0px)+7px);display:grid;grid-template-columns:repeat(5,1fr)}
    .v2-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;padding:3px 0}
    .v2-ni-icon{color:var(--bo);display:flex;align-items:center;justify-content:center}
    .v2-ni-label{font-size:9px;font-weight:500;color:var(--bo);letter-spacing:.01em}
    .v2-nav-item.active .v2-ni-icon,.v2-nav-item.active .v2-ni-label{color:var(--ink)}
    .v2-nav-cta .v2-ni-icon{width:36px;height:36px;background:var(--ink);border-radius:11px;display:flex;align-items:center;justify-content:center}
    .v2-nav-cta .v2-ni-icon svg{color:var(--drawer)}
    .v2-nav-cta .v2-ni-label{color:var(--ink)}
  </style>
</head>
<body>

<nav class="v2-nav">
  <div id="v2NavBrand"><span class="v2-monogram" id="v2Monogram">MA</span></div>
  <button class="v2-nav-btn" onclick="abrirBooking&&abrirBooking()">Agendar</button>
</nav>

<div class="v2-photo"><img id="v2Photo" src="" alt="Doctor"></div>

<div class="v2-drawer">
  <div class="v2-handle"></div>
  <h1 class="v2-name" id="v2Name">Dr. Médico</h1>
  <div class="v2-esp" id="v2Esp">ESPECIALIDAD · CIUDAD</div>
  <div class="v2-precio-tag" id="v2Precio"><span class="v2-precio-dot"></span>Consulta<span class="v2-precio-dot"></span><span class="v2-precio-val" id="v2PVal"></span></div>

  <div class="v2-chips">
    <button class="v2-chip active" data-panel="pSobre">Sobre mí</button>
    <button class="v2-chip" data-panel="pServ">Servicios</button>
    <button class="v2-chip" data-panel="pForm">Formación</button>
    <button class="v2-chip" data-panel="pConsulta">Consulta</button>
    <button class="v2-chip" data-panel="pGal">Galería</button>
    <button class="v2-chip" data-panel="pUbic">Ubicación</button>
  </div>

  <div id="pSobre" class="v2-panel">
    <p class="v2-about-bio" id="v2Bio">Especialista comprometido con la excelencia clínica y la atención personalizada.</p>
    <div class="v2-about-cta">
      <button class="v2-btn-book" onclick="abrirBooking&&abrirBooking()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Agendar consulta
      </button>
      <a class="v2-btn-wa" id="v2Wa" href="#" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.125.554 4.118 1.528 5.843L.057 23.617l5.906-1.55A11.95 11.95 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
      </a>
    </div>
  </div>
  <div id="pServ" class="v2-panel" hidden><div class="v2-srv-list" id="v2SrvList"></div></div>
  <div id="pForm" class="v2-panel" hidden><div class="v2-cred-list" id="v2CredList"></div></div>

    <div class="v2-consult-row"><span class="v2-consult-label">Precio consulta</span><span class="v2-consult-value" id="v2PC">—</span></div>
    <div class="v2-consult-row"><span class="v2-consult-label">Horario</span><span class="v2-consult-value" id="v2PH">Lun – Vie</span></div>
    <div class="v2-consult-row"><span class="v2-consult-label">Ciudad</span><span class="v2-consult-value" id="v2PCi">—</span></div>
  </div>
  <div id="pGal" class="v2-panel" hidden><div class="v2-gallery" id="v2Gal"></div></div>
  <div id="pUbic" class="v2-panel" hidden><div id="v2LocList" style="display:flex;flex-direction:column;gap:12px"></div></div>

  <div class="v2-footer"><div class="v2-footer-icon">C</div><span class="v2-footer-text">Powered by <a href="https://citadoc.lat" target="_blank" rel="noopener">CitaDoc Health Network</a></span></div>
  <div id="v2Edit" style="display:none">
    <button class="v2-edit-toggle" onclick="var p=document.getElementById('v2EP');p.classList.toggle('open');this.textContent=p.classList.contains('open')?'✕ Cerrar':'⚙ Editar manual'">⚙ Editar manual</button>
    <div class="v2-edit-panel" id="v2EP">
      <a class="v2-edit-link" href="/citadoc-dashboard.html?panel=sitio" target="_blank"><span>📋 Servicios</span><span>↗</span></a>
      <a class="v2-edit-link" href="/citadoc-dashboard.html?panel=sitio" target="_blank"><span>🎓 Formación</span><span>↗</span></a>
      <a class="v2-edit-link" href="/citadoc-dashboard.html?panel=sitio" target="_blank"><span>✏️ Texto</span><span>↗</span></a>
    </div>
  </div>
</div>

<nav class="v2-bottom-nav">
  <a class="v2-nav-item active" href="#"><div class="v2-ni-icon"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg></div><span class="v2-ni-label">Inicio</span></a>
  <a class="v2-nav-item" href="#" onclick="document.querySelector('[data-panel=pServ]').click()"><div class="v2-ni-icon"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg></div><span class="v2-ni-label">Servicios</span></a>
  <a class="v2-nav-item v2-nav-cta" href="#" onclick="event.preventDefault();abrirBooking&&abrirBooking()"><div class="v2-ni-icon"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><span class="v2-ni-label">Agendar</span></a>
  <a class="v2-nav-item" id="v2NWa" href="#" target="_blank"><div class="v2-ni-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--bo)"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.125.554 4.118 1.528 5.843L.057 23.617l5.906-1.55A11.95 11.95 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg></div><span class="v2-ni-label">WhatsApp</span></a>
  <a class="v2-nav-item" href="#"><div class="v2-ni-icon"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span class="v2-ni-label">Sobre mí</span></a>
</nav>

<script>
document.querySelectorAll('.v2-chip').forEach(function(c){c.addEventListener('click',function(){document.querySelectorAll('.v2-chip').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.v2-panel').forEach(function(p){p.hidden=true});c.classList.add('active');var p=document.getElementById(c.dataset.panel);if(p)p.hidden=false;});});
var _sb=supabase.createClient('https://qxoomcqaafogczrvsyhg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b29tY3FhYWZvZ2N6cnZzeWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDAyMzgsImV4cCI6MjA5Mjk3NjIzOH0.HRer4Z0vx1sNbxpZelIiHOqdGwSgpykEOZM5p2To2Vs');
var slug=new URLSearchParams(location.search).get('slug'),isDraft=new URLSearchParams(location.search).get('preview')==='draft';
function el(id){return document.getElementById(id)}function set(id,v){var e=el(id);if(e)e.textContent=v}
if(slug){_sb.from('medicos').select('*').eq('slug',slug).eq('activo',true).single().then(async function(r){
  if(r.error||!r.data)return;
  var m=r.data,wc=m.web_config||{},n=(m.titulo||'Dr.')+' '+m.nombre+' '+m.apellido,esp=(m.especialidades||[])[0]||'',ciudad=m.ciudad||'',photo=wc.doctor_photo_url||m.foto_url||'',logo=wc.logo_url||null,waActive=m.whatsapp_activo&&m.whatsapp,waUrl=waActive?'https://wa.me/'+m.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent('Hola '+n+', quiero agendar.'):'';
  document.title=n+' — CitaDoc';
  if(logo){el('v2NavBrand').innerHTML='<img src="'+logo+'" class="v2-logo" alt="'+n+'">';}else{var ini=((m.nombre||'')[0]||'').toUpperCase()+((m.apellido||'')[0]||'').toUpperCase();set('v2Monogram',ini);}
  var img=el('v2Photo');if(img&&photo)img.src=photo;
  _sb.from('doctor_locations').select('nombre,direccion,ciudad,maps_url').eq('medico_id',m.id).order('created_at').then(function(lr){var ll=el('v2LocList');if(!ll||!lr.data||!lr.data.length)return;ll.innerHTML=lr.data.map(function(l){return'<div style="padding:12px 0;border-bottom:.5px solid var(--bo)"><div style="font-size:.88rem;font-weight:700;color:var(--ink);margin-bottom:2px">'+(l.nombre||'Consultorio')+'</div><div style="font-size:.75rem;color:var(--mu);line-height:1.5">'+(l.direccion||'')+(l.ciudad?', '+l.ciudad:'')+'</div>'+(l.maps_url?'<a href="'+l.maps_url+'" target="_blank" rel="noopener" style="font-size:.68rem;color:var(--mu);font-weight:600;text-decoration:none;display:inline-block;margin-top:.25rem">Ver en mapa →</a>':'')+'</div>';}).join('');});
  set('v2Name',n);set('v2Esp',(esp+(ciudad?' · '+ciudad:'')).toUpperCase());
  set('v2Bio',wc.about_text||wc.doctor_story||m.bio||('Especialista en '+esp+(ciudad?' en '+ciudad:'')+'. Comprometido con la excelencia clínica y la atención de cada paciente.'));
  if(m.precio){var pt=el('v2Precio'),pv=el('v2PVal');if(pt&&pv){pv.textContent='$'+m.precio;pt.style.display='inline-flex';}}
  var wa=el('v2Wa'),nwa=el('v2NWa');if(waActive&&waUrl){if(wa)wa.href=waUrl;if(nwa)nwa.href=waUrl;}else{if(wa)wa.style.display='none';if(nwa)nwa.style.display='none';}
  var srvs=wc.services||[],sl=el('v2SrvList');if(sl)sl.innerHTML=(srvs.length?srvs:[{t:'Artroscopía'},{t:'Ligamentoplastia'},{t:'Prótesis articular'},{t:'Fijación de fracturas'}]).slice(0,6).map(function(s){return'<div class="v2-srv-row"><span class="v2-srv-name">'+(s.t||s.titulo||String(s))+'</span><span class="v2-srv-arr">›</span></div>';}).join('');
  var diffs=wc.differentiators||[],cl=el('v2CredList');if(cl)cl.innerHTML=(diffs.length?diffs:[' Fellowship en artroscopia con técnicas mínimamente invasivas','Máster en lesiones deportivas','Miembro AO International y AAOS']).slice(0,5).map(function(d){return'<div class="v2-cred"><span class="v2-cred-dot"></span>'+d+'</div>';}).join('');
  set('v2PC',m.precio?'$'+m.precio:'—');set('v2PH',(m.dias_atencion&&m.dias_atencion.length?m.dias_atencion.slice(0,5).join(' · '):'Lun – Vie')+' · '+(m.horario_desde||'08:00')+'–'+(m.horario_hasta||'18:00'));set('v2PCi',ciudad||'Ecuador');
  var ig=el('v2Gal');if(ig&&photo){ig.innerHTML='<img src="'+photo+'" alt=""><img src="'+photo+'" alt="" style="filter:grayscale(50%) contrast(1.05)">';}
  if(isDraft){var es=el('v2Edit');if(es)es.style.display='block';}
});}
</script>
</body>
</html>
