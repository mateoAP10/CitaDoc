<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title id="pgTitle">CitaDoc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ═══════════════════════════════════════
   TOKENS — Carbon Ice
═══════════════════════════════════════ */
:root{
  --bg:#060809;
  --sheet:rgba(8,11,14,.88);
  --sheet-border:rgba(0,212,255,.12);
  --card:rgba(255,255,255,.035);
  --card-h:rgba(0,212,255,.06);
  --ink:#F0F4F8;
  --ink2:rgba(240,244,248,.6);
  --mu:rgba(240,244,248,.3);
  --bo:rgba(255,255,255,.07);
  --acc:#00D4FF;
  --acc-dim:rgba(0,212,255,.15);
  --acc-rgb:0,212,255;
  --plat:#8899AA;
  --sans:'Inter',sans-serif;
  --mono:'DM Mono',monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}

/* ═══════════════════════════════════════
   RESET
═══════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--sans);color:var(--ink)}
button,a{cursor:pointer;font-family:var(--sans);text-decoration:none;color:inherit;border:none;background:none}

/* ═══════════════════════════════════════
   PHOTO BG — siempre visible
═══════════════════════════════════════ */
.photo-bg{
  position:fixed;inset:0;z-index:0;
  background:#060809;
}
.photo-bg img{
  width:100%;height:100%;object-fit:cover;
  object-position:center top;
  filter:brightness(.6) contrast(1.1) saturate(.75);
  animation:kb 22s ease-in-out infinite alternate;
  transform-origin:50% 20%;
}
@keyframes kb{
  0%{transform:scale(1) translate(0,0)}
  100%{transform:scale(1.06) translate(-1%,1%)}
}
/* vignette */
.photo-vignette{
  position:fixed;inset:0;z-index:1;
  background:
    radial-gradient(ellipse at center,transparent 30%,rgba(6,8,9,.7) 100%),
    linear-gradient(180deg,rgba(6,8,9,.4) 0%,transparent 35%,rgba(6,8,9,.3) 65%,rgba(6,8,9,.95) 100%);
}

/* ═══════════════════════════════════════
   NAV — sempre sobre la foto
═══════════════════════════════════════ */
.c-nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:calc(env(safe-area-inset-top,0px)+36px) 42px 0;
  display:flex;justify-content:space-between;align-items:center;
  transition:opacity .35s var(--ease);
}
.c-nav.hidden{opacity:0;pointer-events:none}
.nav-id{opacity:0;animation:fup .6s var(--ease) .1s forwards}
.nav-id{margin-left:10px}.nav-mono{font-family:var(--sans);font-size:1.3rem;font-weight:900;color:#fff;letter-spacing:-.04em;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.nav-logo{height:28px;max-width:100px;object-fit:contain}
.nav-right{display:flex;gap:8px;opacity:0;animation:fup .6s var(--ease) .2s forwards}
.nav-btn{
  height:32px;padding:0 .9rem;border-radius:50px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);backdrop-filter:blur(12px);
  color:#fff;font-size:.68rem;font-weight:600;letter-spacing:.03em;
  transition:background .2s;
}
.nav-btn:hover{background:rgba(0,212,255,.15);border-color:rgba(0,212,255,.4)}
.nav-icon{
  width:32px;height:32px;border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;
  transition:background .2s,border-color .2s;
}
.nav-icon:hover{background:rgba(0,212,255,.15);border-color:rgba(0,212,255,.4)}

/* ═══════════════════════════════════════
   HERO OVERLAY — info sobre la foto
═══════════════════════════════════════ */
.hero-overlay{
  position:fixed;top:0;left:0;right:0;z-index:10;
  height:44svh;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 0 18px 0;
  pointer-events:none;
}
.hero-block{
  margin-left:28px;padding-left:16px;
  border-left:1.5px solid rgba(0,212,255,.5);
  margin-bottom:0;
  opacity:0;animation:fup .7s var(--ease) .5s forwards;
}
.hero-badge{
  font-size:.44rem;font-weight:700;letter-spacing:.22em;
  color:var(--acc);text-transform:uppercase;
  margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.hero-badge-pulse{
  width:5px;height:5px;border-radius:50%;background:var(--acc);
  animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hero-name{
  font-size:clamp(1.9rem,8.5vw,2.6rem);
  font-weight:900;line-height:.95;letter-spacing:-.05em;
  color:#fff;margin-bottom:8px;
}
.hero-name .acc{color:var(--acc)}
.hero-tag{
  font-size:.72rem;color:rgba(255,255,255,.45);
  font-weight:400;letter-spacing:.01em;
}

/* ═══════════════════════════════════════
   BOTTOM SHEET — fijo, scroll interno
═══════════════════════════════════════ */
.sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  height:58svh;
  background:var(--sheet);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border-top:1px solid var(--sheet-border);
  border-radius:24px 24px 0 0;
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 -8px 60px rgba(0,0,0,.6);
}
/* top bar del sheet */
.sheet-top{
  flex-shrink:0;
  padding:12px 24px 0;
  border-bottom:1px solid var(--bo);
}
.sheet-handle{
  width:36px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.15);margin:0 auto 12px;
}
.sheet-id{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:12px;
}
.sheet-name{
  font-size:.9rem;font-weight:800;color:var(--ink);letter-spacing:-.03em;
}
.sheet-esp{
  font-size:.48rem;font-weight:600;color:var(--mu);
  text-transform:uppercase;letter-spacing:.16em;margin-top:2px;
}
.sheet-precio{
  display:none;align-items:center;gap:4px;
  font-family:var(--mono);font-size:.78rem;color:var(--acc);
}

/* TABS */
.sheet-tabs{
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  padding:0 4px;
}
.sheet-tabs::-webkit-scrollbar{display:none}
.stab{
  flex:0 0 auto;padding:.65rem 14px;
  font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mu);border-bottom:2px solid transparent;
  transition:color .18s,border-color .18s;white-space:nowrap;
}
.stab.active{color:var(--acc);border-color:var(--acc)}

/* scrollable content */
.sheet-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0;
}
.sheet-body::-webkit-scrollbar{display:none}

/* panel */
.spanel{display:none;padding:20px 24px 100px}
.spanel.active{display:block}

/* ═══════════════════════════════════════
   QUICK ROW
═══════════════════════════════════════ */
.quick-row{
  display:flex;gap:8px;margin-bottom:20px;
}
.q-btn{
  flex:1;height:40px;border-radius:10px;
  border:1px solid var(--bo);background:var(--card);
  color:var(--mu);font-size:.62rem;font-weight:600;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .2s,border-color .2s,color .2s,transform .2s var(--spring);
}
.q-btn:hover{background:var(--acc-dim);border-color:rgba(var(--acc-rgb),.4);color:var(--acc);transform:translateY(-1px)}
.q-btn svg{transition:stroke .2s}
.q-btn:hover svg{stroke:var(--acc)}

/* ═══════════════════════════════════════
   SERVICES — líneas precisas
═══════════════════════════════════════ */
.svc-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 0;
  border-bottom:1px solid var(--bo);
  transition:background .0s;
  position:relative;
  overflow:hidden;
}
.svc-row::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,var(--acc-dim),transparent);
  transition:width .35s var(--ease);
}
.svc-row:hover::before{width:100%}
.svc-row:last-child{border-bottom:none}
.svc-num{
  font-family:var(--mono);font-size:.62rem;color:var(--mu);
  width:20px;flex-shrink:0;letter-spacing:.05em;
}
.svc-icon-sm{
  width:32px;height:32px;border-radius:9px;
  background:var(--card);border:1px solid var(--bo);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .25s,border-color .25s,transform .3s var(--spring);
}
.svc-icon-sm svg{width:14px;height:14px;color:var(--plat);transition:color .25s}
.svc-row:hover .svc-icon-sm{background:var(--acc-dim);border-color:rgba(var(--acc-rgb),.4);transform:scale(1.1)}
.svc-row:hover .svc-icon-sm svg{color:var(--acc)}
.svc-info{flex:1;min-width:0}
.svc-name{font-size:.88rem;font-weight:700;color:var(--ink);letter-spacing:-.01em;transition:color .25s}
.svc-desc{font-size:.68rem;color:var(--mu);margin-top:1px;transition:color .25s}
.svc-row:hover .svc-name{color:var(--acc)}
.svc-row:hover .svc-desc{color:var(--ink2)}
.svc-arr{font-size:.85rem;color:var(--mu);transition:transform .25s,color .25s;flex-shrink:0}
.svc-row:hover .svc-arr{transform:translateX(4px);color:var(--acc)}

/* ═══════════════════════════════════════
   STATS — instrumentos de avión
═══════════════════════════════════════ */
.stats-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-gauge{
  background:var(--card);border:1px solid var(--bo);
  border-radius:14px;padding:16px 10px;text-align:center;
  transition:background .25s,border-color .3s,transform .3s var(--spring);
  position:relative;overflow:hidden;
}
.stat-gauge::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--acc);transform:scaleX(0);transform-origin:left;
  transition:transform .5s var(--ease);
}
.stat-gauge:hover{background:var(--card-h);border-color:rgba(var(--acc-rgb),.3);transform:translateY(-3px)}
.stat-gauge:hover::after{transform:scaleX(1)}
.stat-val{
  font-family:var(--mono);font-size:1.75rem;font-weight:500;
  color:var(--acc);letter-spacing:-.04em;line-height:1;margin-bottom:5px;
}
.stat-key{font-size:.52rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.12em}

/* ═══════════════════════════════════════
   ABOUT
═══════════════════════════════════════ */
.about-photo{
  width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;
  margin-bottom:18px;
  filter:brightness(.9) contrast(1.05) saturate(.8);
  transition:filter .4s;
}
.about-photo:hover{filter:brightness(1) contrast(1.05) saturate(.9)}
.about-line{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--bo);
}
.about-line:last-of-type{border-bottom:none;margin-bottom:18px}
.about-dot{
  width:5px;height:5px;border-radius:50%;background:var(--acc);
  flex-shrink:0;margin-top:.4rem;
}
.about-txt{font-size:13.5px;color:var(--ink2);line-height:1.7}

/* ═══════════════════════════════════════
   FORMATION — timeline precision
═══════════════════════════════════════ */
.form-item{
  display:flex;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--bo);
  transition:background .2s;
}
.form-item:last-child{border-bottom:none}
.form-idx{
  font-family:var(--mono);font-size:.6rem;color:var(--mu);
  width:24px;flex-shrink:0;padding-top:.22rem;letter-spacing:.05em;
}
.form-txt{font-size:13px;color:var(--ink2);line-height:1.65;transition:color .2s}
.form-item:hover .form-txt{color:var(--ink)}

/* ═══════════════════════════════════════
   GALLERY
═══════════════════════════════════════ */
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gal-img{
  width:100%;object-fit:cover;border-radius:12px;display:block;
  filter:brightness(.85) saturate(.7) contrast(1.1);
  transition:filter .4s var(--ease),transform .4s var(--ease);
}
.gal-img:hover{filter:brightness(1) saturate(1) contrast(1.05);transform:scale(1.02)}
.gal-img.main{grid-column:1/-1;aspect-ratio:16/9;border-radius:14px}
.gal-img.sq{aspect-ratio:1}

/* ═══════════════════════════════════════
   LOCATION
═══════════════════════════════════════ */
.loc-row{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--bo);
  transition:color .2s;
}
.loc-row:last-child{border-bottom:none}
.loc-icon{
  width:32px;height:32px;border-radius:9px;background:var(--card);
  border:1px solid var(--bo);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .25s,border-color .25s;
}
.loc-icon svg{width:14px;height:14px;color:var(--plat);transition:color .2s}
.loc-row:hover .loc-icon{background:var(--acc-dim);border-color:rgba(var(--acc-rgb),.4)}
.loc-row:hover .loc-icon svg{color:var(--acc)}
.loc-name{font-size:.9rem;font-weight:700;color:var(--ink);margin-bottom:3px;transition:color .2s}
.loc-addr{font-size:.74rem;color:var(--mu);line-height:1.5}
.loc-map{font-size:.68rem;font-weight:700;color:var(--acc);display:inline-block;margin-top:.3rem;transition:letter-spacing .2s}
.loc-map:hover{letter-spacing:.04em}

/* ═══════════════════════════════════════
   BOTTOM NAV (dentro del sheet)
═══════════════════════════════════════ */
.sheet-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(6,8,9,.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--bo);
  padding:10px 20px calc(env(safe-area-inset-bottom,0px)+10px);
  display:flex;gap:8px;
}
.bn-ghost{
  flex:1;height:44px;border-radius:12px;
  border:1px solid var(--bo);background:transparent;color:var(--mu);
  font-size:.7rem;font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .2s,border-color .2s,color .2s,transform .2s var(--spring);
}
.bn-ghost:hover{background:var(--acc-dim);border-color:rgba(var(--acc-rgb),.4);color:var(--acc);transform:translateY(-1px)}
.bn-cta{
  flex:1.5;height:44px;border-radius:12px;
  background:var(--acc);color:#000;
  font-family:var(--sans);font-size:.74rem;font-weight:800;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 20px rgba(var(--acc-rgb),.35);
  transition:transform .2s var(--spring),box-shadow .2s,filter .2s;
}
.bn-cta:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(var(--acc-rgb),.5);filter:brightness(1.1)}

/* ═══════════════════════════════════════
   FLOATS
═══════════════════════════════════════ */
.floats{
  position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));
  z-index:25;display:none;flex-direction:column;gap:8px;
}
.float-btn{
  width:44px;height:44px;border-radius:50%;border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
  transition:transform .25s var(--spring);position:relative;
}
.float-btn::after{content:'';position:absolute;inset:0;border-radius:50%;animation:pulse 2.8s ease-in-out infinite}
.float-btn:hover{transform:scale(1.1)}
.float-wa{background:#25D366}.float-wa::after{box-shadow:0 0 0 0 rgba(37,211,102,.4)}
.float-ig{background:linear-gradient(135deg,#f09433,#dc2743,#bc1888)}.float-ig::after{box-shadow:0 0 0 0 rgba(220,39,67,.35)}
@keyframes pulse{0%,100%{opacity:.6;box-shadow:0 0 0 0 currentColor}50%{opacity:0;box-shadow:0 0 0 10px transparent}}

/* ═══════════════════════════════════════
   MODALS
═══════════════════════════════════════ */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{width:100%;max-width:480px;background:#0D1117;border-radius:24px 24px 0 0;border-top:1px solid var(--sheet-border);padding:0 0 calc(env(safe-area-inset-bottom,0px)+20px);animation:sheetUp .38s var(--ease) forwards;position:relative}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:3px;border-radius:2px;background:var(--bo);margin:14px auto 22px}
.modal-title{font-size:1.1rem;font-weight:800;color:var(--ink);letter-spacing:-.03em;padding:0 22px;margin-bottom:4px}
.modal-sub{font-size:.72rem;color:var(--mu);padding:0 22px;margin-bottom:16px;line-height:1.5}
.modal-body{padding:0 22px}
.modal-opt{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;background:var(--card);border:1px solid var(--bo);margin-bottom:8px;transition:background .2s,border-color .2s,transform .25s var(--spring)}
.modal-opt:hover{background:var(--acc-dim);border-color:rgba(var(--acc-rgb),.3);transform:translateY(-2px)}
.modal-opt-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem}
.modal-opt-title{font-size:.86rem;font-weight:700;color:var(--ink);margin-bottom:1px}
.modal-opt-sub{font-size:.68rem;color:var(--mu)}
.modal-close{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;border:1px solid var(--bo);background:transparent;color:var(--mu);font-size:.72rem;display:flex;align-items:center;justify-content:center;transition:background .2s}
.modal-close:hover{background:var(--acc-dim);color:var(--acc)}

/* SIDEBAR */
.sb-overlay{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;opacity:0;transition:opacity .3s}
.sb-overlay.open{display:block;opacity:1}
.sidebar{position:fixed;top:0;right:0;bottom:0;z-index:120;width:210px;background:#0D1117;border-left:1px solid var(--sheet-border);padding:calc(env(safe-area-inset-top,0px)+18px) 0 20px;transform:translateX(100%);transition:transform .38s var(--ease);display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 16px;border-bottom:1px solid var(--bo);margin-bottom:8px}
.sb-label{font-size:.58rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.16em}
.sb-close{width:28px;height:28px;border-radius:50%;border:1px solid var(--bo);background:transparent;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:var(--mu);transition:background .2s,color .2s}
.sb-close:hover{background:var(--acc-dim);color:var(--acc)}
.sb-nav{display:flex;flex-direction:column;padding:0 8px;gap:1px}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:.82rem;font-weight:500;color:var(--ink2);background:transparent;text-align:left;transition:background .15s,color .15s}
.sb-item:hover,.sb-item.active{background:var(--acc-dim);color:var(--acc)}
.sb-item svg{flex-shrink:0;color:var(--mu);transition:color .15s}
.sb-item:hover svg,.sb-item.active svg{color:var(--acc)}

/* REVEAL */
.rev{opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.rev.on{opacity:1;transform:translateY(0)}
.d1{transition-delay:.06s}.d2{transition-delay:.12s}.d3{transition-delay:.18s}.d4{transition-delay:.24s}.d5{transition-delay:.30s}

/* SECTION LABEL */
.slabel{font-size:.5rem;font-weight:700;letter-spacing:.2em;color:var(--acc);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.slabel::before{content:'';display:block;width:14px;height:1px;background:var(--acc)}

@keyframes fup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- PHOTO BG -->
<div class="photo-bg"><img id="cPhoto" src="" alt=""></div>
<div class="photo-vignette"></div>

  _bookUrl=wc.booking_url||('https://citadoc.lat/agendar?slug='+esc(m.slug));

  document.title=nombre+' — CitaDoc';
  var rgb=acc.replace('#','').match(/.{2}/g).map(function(x){return parseInt(x,16)});
  document.documentElement.style.setProperty('--acc',acc);
  document.documentElement.style.setProperty('--acc-rgb',rgb.join(','));
  document.documentElement.style.setProperty('--acc-dim','rgba('+rgb.join(',')+', .12)');
  document.documentElement.style.setProperty('--sheet-border','rgba('+rgb.join(',')+', .15)');

  if(logo){el('cBrand').innerHTML='<img class="nav-logo" src="'+esc(logo)+'" alt="'+esc(nombre)+'">';}
  else{set('cMono',((m.nombre||'')[0]||'').toUpperCase()+((m.apellido||'')[0]||'').toUpperCase());}

  var img=el('cPhoto');if(img&&photo)img.src=photo;

  // hero
  set('hBadge',(esp+(ciudad?' · '+ciudad:'')).toUpperCase());
  el('hName').innerHTML=(m.titulo||'Dr.')+' '+esc(m.nombre)+'<br><span class="acc">'+esc(m.apellido)+'</span>';
  set('hTag',wc.subheadline||('Especialista en '+esp+' · '+ciudad));

  // sheet id
  set('sName',nombre);set('sEsp',(esp+(ciudad?' · '+ciudad:'')).toUpperCase());
  if(m.precio){el('sPrecio').style.display='flex';set('sPrecioVal','$'+m.precio);}

  // WA
  if(waOn&&_waUrl){
    [el('mWaOpt'),el('cWaBtn'),el('fWa'),el('qWa'),el('bnWa')].forEach(function(e){if(e){e.style.display='';if(e.tagName==='A')e.href=_waUrl;}});
    el('cFloats').style.display='flex';
  }
  if(ig){var fi=el('fIg');if(fi){fi.href='https://instagram.com/'+ig.replace('@','');fi.style.display='flex';el('cFloats').style.display='flex';}}
  if(m.telefono){_callUrl='tel:'+m.telefono;var qc=el('qCall');if(qc)qc.style.display='flex';}

  set('mAgTitle','Agendar con '+(m.titulo||'Dr.')+' '+m.nombre);
  var bo=el('mBookOpt');if(bo){bo.href='#';bo.onclick=function(e){e.preventDefault();closeModal('modalAgendar');if(window.AgendarCinema)AgendarCinema.open(_medicoData,_locsData);};}

  // services
  var srvs=wc.services||[];
  var defaults=[{t:'Consulta especializada',desc:'Evaluación clínica y diagnóstico preciso'},{t:'Diagnóstico de precisión',desc:'Estudios avanzados de vanguardia'},{t:'Plan de tratamiento',desc:'Protocolo personalizado'},{t:'Seguimiento continuo',desc:'Acompañamiento integral'},{t:'Procedimientos avanzados',desc:'Técnicas mínimamente invasivas'}];
  el('cSvcList').innerHTML=(srvs.length?srvs:defaults).slice(0,6).map(function(s,i){
    var n=esc(s.t||s.titulo||s.name||String(s));
    var d=esc(s.desc||s.description||'');
    return'<div class="svc-row">'
      +'<span class="svc-num">0'+(i+1)+'</span>'
      +'<div class="svc-icon-sm">'+ICONS[i%ICONS.length]+'</div>'
      +'<div class="svc-info"><div class="svc-name">'+n+'</div>'+(d?'<div class="svc-desc">'+d+'</div>':'')+'</div>'
      +'<span class="svc-arr">›</span>'
      +'</div>';
  }).join('');

  // about
  if(photo){var ap=el('cAboutPhoto');if(ap){ap.src=photo;ap.style.display='block';}}
  var bio=wc.about_text||wc.doctor_story||m.bio||('Especialista en '+esp+(ciudad?' en '+ciudad:'')+'. Con años de experiencia y formación internacional, mi compromiso es brindarte la más alta calidad en atención médica.');
  var sentences=bio.split(/\.\s+/).filter(Boolean);
  el('cAboutLines').innerHTML=sentences.slice(0,4).map(function(s){
    return'<div class="about-line rev"><span class="about-dot"></span><span class="about-txt">'+esc(s.trim().replace(/\.$/,''))+'.</span></div>';
  }).join('');

  // stats
  var stats=wc.stats||[];
  if(stats.length){
    el('cStatsGrid').innerHTML=stats.slice(0,3).map(function(s,i){
      return'<div class="stat-gauge" data-t="'+esc(String(s.n||s.num||0))+'">'
        +'<div class="stat-val" id="sv'+i+'">'+esc(String(s.n||s.num||0))+'</div>'
        +'<div class="stat-key">'+esc(s.l||s.label||'')+'</div>'
        +'</div>';
    }).join('');
    var so=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var n=e.target.querySelector('.stat-val'),t=parseFloat(e.target.dataset.t)||0;if(n&&t)countUp(n,t);so.unobserve(e.target)})},{threshold:0.5,root:document.querySelector('.sheet-body')});
    document.querySelectorAll('.stat-gauge').forEach(function(c){so.observe(c)});
  } else {
    el('cStatsGrid').innerHTML='<div style="grid-column:1/-1;font-size:.8rem;color:var(--mu);padding:.5rem 0">Sin estadísticas configuradas aún.</div>';
  }

  // formation
  var fd=diffs.length?diffs:['Especialización con sólida formación clínica','Atención basada en evidencia internacional','Actualización continua en técnicas avanzadas'];
  el('cFormList').innerHTML=fd.slice(0,6).map(function(d,i){
    return'<div class="form-item rev d'+Math.min(i,4)+'">'
      +'<span class="form-idx">0'+(i+1)+'</span>'
      +'<span class="form-txt">'+esc(d)+'</span>'
      +'</div>';
  }).join('');

  // gallery
  if(photo){
    el('cGallery').innerHTML=
      '<img class="gal-img main rev" src="'+esc(photo)+'" alt="">'
      +'<img class="gal-img sq rev d1" src="'+esc(photo)+'" alt="" style="filter:brightness(.7) saturate(.5) contrast(1.2)">'
      +'<img class="gal-img sq rev d2" src="'+esc(photo)+'" alt="" style="filter:brightness(.8) saturate(.6) contrast(1.15) hue-rotate(180deg)">';
  }

  // locs
  if(locs&&locs.length){
    el('cLocs').innerHTML=locs.map(function(l,i){
      return'<div class="loc-row rev d'+Math.min(i,3)+'">'
        +'<div class="loc-icon"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>'
        +'<div><div class="loc-name">'+esc(l.nombre||'Consultorio')+'</div>'
        +'<div class="loc-addr">'+esc((l.direccion||'')+(l.ciudad?', '+l.ciudad:''))+'</div>'
        +(l.maps_url?'<a class="loc-map" href="'+esc(l.maps_url)+'" target="_blank" rel="noopener">Ver en mapa →</a>':'')
        +'</div></div>';
    }).join('');
    el('mSedesBody').innerHTML=locs.map(function(l){
      return'<a class="modal-opt" '+(l.maps_url?'href="'+esc(l.maps_url)+'" target="_blank"':'href="#"')+'>'
        +'<div class="modal-opt-icon" style="background:rgba(0,212,255,.1)">📍</div>'
        +'<div><div class="modal-opt-title">'+esc(l.nombre||'Consultorio')+'</div><div class="modal-opt-sub">'+esc((l.direccion||'')+(l.ciudad?', '+l.ciudad:''))+'</div></div>'
        +'</a>';
    }).join('');
  }

  setTimeout(initReveal,200);
}

function show404(){document.body.style.overflow='auto';document.body.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100svh;gap:.75rem;background:#060809;color:#fff;font-family:\'Inter\',sans-serif"><div style="font-size:3rem;font-weight:900;opacity:.12;letter-spacing:-.08em">404</div><div style="font-size:.85rem;opacity:.4">Este médico aún no tiene su sitio en CitaDoc.</div></div>'}

async function init(){
  var s=getSlug();if(!s){show404();return;}
  var r=await _sb.from('medicos').select('*').eq('slug',s).eq('activo',true).maybeSingle();
  if(r.error||!r.data){show404();return;}
  if(!new URLSearchParams(location.search).get('_admin'))
    _sb.from('website_page_views').insert({medico_id:r.data.id,slug:s,source:(document.referrer.includes('google')?'google':document.referrer.includes('instagram')?'instagram':document.referrer.includes('facebook')?'facebook':document.referrer?'referral':'direct'),user_agent:navigator.userAgent.slice(0,200)});
  var lr=await _sb.from('doctor_locations').select('id,nombre,direccion,ciudad,maps_url').eq('medico_id',r.data.id).order('created_at');
  _medicoData=r.data;_locsData=lr.data||[];
  render(r.data,lr.data||[]);
  if(window.CitaDocReviews) CitaDocReviews.mount(_sb, r.data, {after:"pLoc"});
}
init();
</script>
<script src="/js/reviews-public.js"></script>
<script src="/js/shared.js"></script>
<script src="/js/agendar-cinema.js"></script>
</body>
</html>
