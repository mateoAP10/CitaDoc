<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title id="pgTitle">CitaDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#F5EFE7;--surface:linear-gradient(180deg,#FFF8F1 0%,#F2E8DD 100%);--primary:#B98B5C;--primary-soft:#E4C9A8;--text:#3D342C;--muted:#857668;--line:rgba(61,52,44,.1);--primary-bg:rgba(185,139,92,.15)
      --sans:'Inter',sans-serif;--serif:'Fraunces',serif;
      --sb:72px;
    }
    html,body{height:100%;background:var(--bg);font-family:var(--sans);color:var(--text);overflow:hidden}

    /* LAYOUT: sidebar oculta por defecto — main ocupa todo */
    .v3-layout{display:block;height:100svh;position:relative}

    /* SIDEBAR — completamente oculta, overlay al abrir */
    .v3-sidebar{
      position:fixed;top:0;bottom:0;left:0;
      width:190px;
      background:var(--surface);border-right:1px solid var(--line);
      display:flex;flex-direction:column;align-items:flex-start;
      padding:calc(env(safe-area-inset-top,0px)+18px) 20px calc(env(safe-area-inset-bottom,0px)+16px);
      z-index:60;overflow:hidden;
      transform:translateX(-100%);
      transition:transform .42s cubic-bezier(.19,1,.22,1);
    }
    .v3-sidebar.open{transform:translateX(0)}
    .v3-mono{width:38px;height:38px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:.82rem;font-weight:600;color:#fff;flex-shrink:0;margin-bottom:24px}
    .v3-nav{display:flex;flex-direction:column;gap:3px;width:100%;flex:1}
    .v3-nav-item{display:flex;align-items:center;gap:11px;width:40px;height:40px;border-radius:11px;border:none;background:transparent;cursor:pointer;color:var(--muted);font-family:var(--sans);font-size:.8rem;font-weight:500;transition:background .18s,color .18s;text-decoration:none;padding:0;justify-content:center;white-space:nowrap;overflow:hidden}
    .v3-sidebar.open .v3-nav-item{width:100%;padding:0 10px;justify-content:flex-start;overflow:visible}
    .v3-nav-item:hover{background:var(--line);color:var(--text)}
    .v3-nav-item.active{background:var(--primary-bg, rgba(47,107,255,.15));color:var(--primary)}
    .v3-nav-label{display:none;font-size:.8rem}
    .v3-sidebar.open .v3-nav-label{display:block}
    .v3-expand-btn{width:40px;height:40px;border-radius:12px;background:var(--line);border:1px solid var(--line);backdrop-filter:blur(20px);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;line-height:1;margin-top:auto;flex-shrink:0;transition:background .2s}
    .v3-expand-btn:hover{opacity:.8}

    /* MAIN: ocupa toda la pantalla */
    .v3-main{overflow-y:auto;display:flex;flex-direction:column;height:100svh}

    /* PHOTO SCENE — top portion */
    .v3-scene{position:relative;height:58svh;min-height:300px;flex-shrink:0}
    .v3-scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block;filter:contrast(1.02) brightness(.95) saturate(1.08)}
    .v3-scene-ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(61,52,44,.82) 0%,rgba(61,52,44,.4) 45%,rgba(61,52,44,.08) 100%),linear-gradient(0deg,rgba(61,52,44,.78) 0%,transparent 55%)}
    .v3-scene-content{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 22px 16px}
    .v3-dr-name{font-size:.55rem;font-weight:700;color:var(--primary-soft);text-transform:uppercase;letter-spacing:.18em;margin-bottom:2px}
    .v3-dr-esp{font-size:.5rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
    .v3-headline{font-family:var(--serif);font-size:clamp(1.4rem,5vw,2rem);font-weight:300;line-height:1.18;letter-spacing:-.02em;color:#fff;margin-bottom:12px}
    .v3-headline em{font-style:italic;color:var(--primary-soft)}
    .v3-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
    .v3-tag{padding:.22rem .65rem;border-radius:50px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);font-size:.58rem;font-weight:500;color:rgba(255,255,255,.6)}
    .v3-scene-ctas{display:flex;gap:9px;align-items:center}
    .v3-btn-book{height:42px;padding:0 1.2rem;border-radius:12px;border:none;background:linear-gradient(180deg,#C8986A 0%,#A87A4E 100%);color:#fff;font-family:var(--sans);font-size:.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(185,139,92,.35);transition:opacity .2s}
    .v3-btn-book:hover{opacity:.9}
    .v3-btn-wa{font-size:.78rem;font-weight:500;color:rgba(255,255,255,.6);background:none;border:none;cursor:pointer;text-decoration:none;transition:color .2s}
    .v3-btn-wa:hover{color:#fff}

    /* BELOW PHOTO — scrollable content */
    .v3-below{flex:1;background:var(--bg);padding:18px 22px;padding-bottom:calc(env(safe-area-inset-bottom,0px)+70px)}

    /* Chips */
    .v3-chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:14px;margin:0 -22px;padding-left:22px;padding-right:22px;scroll-snap-type:x mandatory}
    .v3-chips::-webkit-scrollbar{display:none}
    .v3-chip{flex:0 0 auto;scroll-snap-align:start;height:30px;padding:0 13px;border-radius:100px;border:1.5px solid var(--line);background:transparent;font-family:var(--sans);font-size:.68rem;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;transition:all .18s}
    .v3-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .v3-panel[hidden]{display:none}

    /* Bio */
    .v3-bio{font-size:13px;color:var(--muted);line-height:1.72;margin-bottom:12px}

    /* Servicios */
    .v3-srv-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:.5px solid var(--line)}
    .v3-srv-row:last-child{border-bottom:none}
    .v3-srv-name{font-size:.88rem;font-weight:600;color:var(--text)}
    .v3-srv-arr{font-size:.78rem;color:var(--muted)}

    /* Formación */
    .v3-cred{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:9px}
    .v3-cred-dot{width:4px;height:4px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:.28rem}

    /* Galería */
    .v3-gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .v3-gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}

    /* Sede */
    .v3-sede-item{padding:10px 0;border-bottom:.5px solid var(--line)}
    .v3-sede-item:last-child{border-bottom:none}
    .v3-sede-name{font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:2px}
    .v3-sede-addr{font-size:.75rem;color:var(--muted);line-height:1.5}
    .v3-sede-map{font-size:.68rem;color:var(--primary);font-weight:600;text-decoration:none;display:inline-block;margin-top:.25rem}

    /* Precio */
    .v3-precio{display:none;align-items:center;gap:.4rem;font-size:12px;color:var(--muted);font-weight:500;padding:.6rem 0;border-top:.5px solid var(--line);margin-top:8px}
    .v3-precio-dot{width:3px;height:3px;border-radius:50%;background:var(--muted);flex-shrink:0}
    .v3-precio-val{color:var(--muted);font-weight:600}

    /* CitaDoc footer — SIEMPRE */
    .v3-cd-footer{padding:14px 0 6px;display:flex;align-items:center;justify-content:center;gap:.4rem;border-top:.5px solid var(--line);margin-top:12px}
    .v3-cd-icon{width:17px;height:17px;border-radius:5px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.52rem;font-weight:800;color:#fff}
    .v3-cd-text{font-size:.6rem;color:var(--muted)}
    .v3-cd-text a{color:var(--muted);text-decoration:none;font-weight:600}

    /* Quick actions bottom */
    .v3-qa{position:fixed;bottom:0;right:0;left:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
    .v3-qa-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 8px;border:none;background:transparent;cursor:pointer;border-right:1px solid var(--line);transition:background .18s}
    .v3-qa-btn:last-child{border-right:none}
    .v3-qa-btn:hover{background:var(--line)}
    .v3-qa-icon{font-size:.9rem}
    .v3-qa-label{font-size:.58rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

    /* ≡ button — flota siempre en top-left */
    .v3-mobile-btn{position:fixed;top:calc(env(safe-area-inset-top,0px)+14px);left:14px;z-index:65;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;line-height:1}
    .v3-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;backdrop-filter:blur(2px)}
    .v3-overlay.show{display:block}
  </style>
</head>
<body>

<button class="v3-mobile-btn" onclick="toggleSb()">&#9776;</button>
<div class="v3-overlay" id="v3Ov" onclick="toggleSb()"></div>

<div class="v3-layout">

  <!-- SIDEBAR -->
  <aside class="v3-sidebar" id="v3Sb">
    <div class="v3-mono" id="v3Mono">MA</div>
    <nav class="v3-nav">
      <a class="v3-nav-item active" href="#"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span class="v3-nav-label">Inicio</span></a>
      <a class="v3-nav-item" href="#"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="v3-nav-label">Sobre mí</span></a>
      <a class="v3-nav-item" href="#"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><span class="v3-nav-label">Servicios</span></a>
      <a class="v3-nav-item" href="#"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span class="v3-nav-label">Resultados</span></a>
      <a class="v3-nav-item" href="#"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><span class="v3-nav-label">Formación</span></a>
      <a class="v3-nav-item" href="#"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="v3-nav-label">Contacto</span></a>
    </nav>

  </aside>

  <!-- MAIN SCROLLABLE -->
  <main class="v3-main">

    <!-- FOTO SCENE -->
    <div class="v3-scene">
      <img id="v3Img" src="" alt="Doctor">
      <div class="v3-scene-ov"></div>
      <div class="v3-scene-content">
        <div class="v3-dr-name" id="v3DrName">DR. MÉDICO</div>
        <div class="v3-dr-esp" id="v3DrEsp">ESPECIALIDAD · CIUDAD</div>
        <h1 class="v3-headline" id="v3Hl">Excelencia que transforma<br><em>confianza en ti.</em></h1>
        <div class="v3-tags" id="v3Tags"></div>
        <div class="v3-scene-ctas">
          <button class="v3-btn-book" onclick="abrirBooking&&abrirBooking()">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            Agendar cita
          </button>
          <a class="v3-btn-wa" id="v3Wa" href="#" target="_blank" rel="noopener" style="display:none">WhatsApp →</a>
        </div>
      </div>
    </div>

    <!-- CONTENIDO DEBAJO SIEMPRE -->
    <div class="v3-below">

      <!-- Chips -->
      <div class="v3-chips">
        <button class="v3-chip active" data-p="pBio">Sobre mí</button>
        <button class="v3-chip" data-p="pServ">Servicios</button>
        <button class="v3-chip" data-p="pForm">Formación</button>
        <button class="v3-chip" data-p="pGal">Galería</button>
        <button class="v3-chip" data-p="pSede">Sede</button>
      </div>

      <div id="pBio" class="v3-panel"><p class="v3-bio" id="v3Bio">Especialista comprometido con la excelencia clínica.</p></div>
      <div id="pServ" class="v3-panel" hidden><div id="v3Srv"></div></div>
      <div id="pForm" class="v3-panel" hidden><div id="v3Form"></div></div>
      <div id="pGal" class="v3-panel" hidden><div class="v3-gal" id="v3Gal"></div></div>
      <div id="pSede" class="v3-panel" hidden><div id="v3Sede"></div></div>

      <!-- Precio — siempre -->
      <div class="v3-precio" id="v3Precio">
        <span class="v3-precio-dot"></span>Consulta<span class="v3-precio-dot"></span>
        <span class="v3-precio-val" id="v3PVal"></span>
      </div>

      <!-- CitaDoc Health Network — SIEMPRE -->
      <div class="v3-cd-footer">
        <div class="v3-cd-icon">C</div>
        <span class="v3-cd-text">Powered by <a href="https://citadoc.lat" target="_blank" rel="noopener">CitaDoc Health Network</a></span>
      </div>

    </div>
  </main>

</div>

<!-- Quick Actions — fixed bottom -->
<div class="v3-qa">
  <button class="v3-qa-btn" onclick="document.querySelector('[data-p=pServ]').click()"><span class="v3-qa-icon">⚕️</span><span class="v3-qa-label">Procedimientos</span></button>
  <button class="v3-qa-btn"><span class="v3-qa-icon">📈</span><span class="v3-qa-label">Resultados</span></button>
  <button class="v3-qa-btn"><span class="v3-qa-icon">💬</span><span class="v3-qa-label">Testimonios</span></button>
</div>

<script>
var expanded=false, sbOpen=false;
function toggleSb(){
  sbOpen=!sbOpen;
  document.getElementById('v3Sb').classList.toggle('open',sbOpen);
  document.getElementById('v3Ov').classList.toggle('show',sbOpen);
  // Cerrar al clickear nav item
  if(!sbOpen) return;
  document.querySelectorAll('.v3-nav-item').forEach(function(a){a.onclick=function(){toggleSb();}});
}
// Chips
document.querySelectorAll('.v3-chip').forEach(function(c){
  c.addEventListener('click',function(){
    document.querySelectorAll('.v3-chip').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.v3-panel').forEach(function(p){p.hidden=true});
    c.classList.add('active');
    var p=document.getElementById(c.dataset.p);if(p)p.hidden=false;
  });
});

var _sb=supabase.createClient('https://qxoomcqaafogczrvsyhg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b29tY3FhYWZvZ2N6cnZzeWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDAyMzgsImV4cCI6MjA5Mjk3NjIzOH0.HRer4Z0vx1sNbxpZelIiHOqdGwSgpykEOZM5p2To2Vs');
var slug=new URLSearchParams(location.search).get('slug');
var isDraft=new URLSearchParams(location.search).get('preview')==='draft';
function el(id){return document.getElementById(id)}function set(id,v){var e=el(id);if(e)e.textContent=v}

if(slug){_sb.from('medicos').select('*').eq('slug',slug).eq('activo',true).single().then(async function(r){
  if(r.error||!r.data)return;
  var m=r.data,wc=m.web_config||{},n=(m.titulo||'Dr.')+' '+m.nombre+' '+m.apellido,esp=(m.especialidades||[])[0]||'',ciudad=m.ciudad||'',photo=wc.doctor_photo_url||m.foto_url||'',logo=wc.logo_url||null,waActive=m.whatsapp_activo&&m.whatsapp,waUrl=waActive?'https://wa.me/'+m.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent('Hola '+n+', quiero agendar.'):'';
  document.title=n+' — CitaDoc';
  var mono=el('v3Mono');if(mono){var ini=((m.nombre||'')[0]||'').toUpperCase()+((m.apellido||'')[0]||'').toUpperCase();if(logo){mono.innerHTML='<img src="'+logo+'" style="height:26px;max-width:55px;object-fit:contain;filter:brightness(0) invert(1)">';}else{mono.textContent=ini;}}
  var img=el('v3Img');if(img&&photo)img.src=photo;
  set('v3DrName',n.toUpperCase());set('v3DrEsp',(esp+(ciudad?' · '+ciudad:'')).toUpperCase());
  el('v3Hl').innerHTML=wc.headline||'Excelencia que transforma<br><em>confianza en ti.</em>';
  var tags=(m.especialidades||[]).concat((wc.differentiators||[]).slice(0,2)).slice(0,4);
  var tg=el('v3Tags');if(tg)tg.innerHTML=tags.map(function(t){return'<span class="v3-tag">'+t+'</span>';}).join('');
  if(waActive&&waUrl){var wl=el('v3Wa');if(wl){wl.href=waUrl;wl.style.display='block';}}
  // Bio
  set('v3Bio',wc.about_text||wc.doctor_story||m.bio||('Especialista en '+esp+(ciudad?' en '+ciudad:'')+'. Comprometido con la excelencia clínica y la atención personalizada de cada paciente.'));
  // Servicios
  var srvs=wc.services||[],sl=el('v3Srv');
  if(sl)sl.innerHTML=(srvs.length?srvs:[{t:'Consulta especializada'},{t:'Diagnóstico de precisión'},{t:'Plan de tratamiento'},{t:'Seguimiento continuo'}]).slice(0,6).map(function(s){return'<div class="v3-srv-row"><span class="v3-srv-name">'+(s.t||s.titulo||String(s))+'</span><span class="v3-srv-arr">›</span></div>';}).join('');
  // Formación
  var diffs=wc.differentiators||[],fl=el('v3Form');
  if(fl)fl.innerHTML=(diffs.length?diffs:['Especialización con sólida formación clínica','Atención basada en evidencia']).slice(0,5).map(function(d){return'<div class="v3-cred"><span class="v3-cred-dot"></span>'+d+'</div>';}).join('');
  // Galería
  var ig=el('v3Gal');if(ig&&photo){ig.innerHTML='<img src="'+photo+'" alt=""><img src="'+photo+'" alt="" style="filter:contrast(1.05) brightness(.88) saturate(.8)">';}
  // Precio
  if(m.precio){var pr=el('v3Precio'),pv=el('v3PVal');if(pr&&pv){pv.textContent='$'+m.precio;pr.style.display='flex';}}
  // Sedes
  var lr=await _sb.from('doctor_locations').select('nombre,direccion,ciudad,maps_url,telefono').eq('medico_id',m.id).order('created_at');
  var sd=el('v3Sede');
  if(sd&&lr.data&&lr.data.length){sd.innerHTML=lr.data.map(function(l){return'<div class="v3-sede-item"><div class="v3-sede-name">'+(l.nombre||'Consultorio')+'</div><div class="v3-sede-addr">'+(l.direccion||'')+(l.ciudad?', '+l.ciudad:'')+'</div>'+(l.maps_url?'<a class="v3-sede-map" href="'+l.maps_url+'" target="_blank" rel="noopener">Ver en mapa →</a>':'')+'</div>';}).join('');}
});}
</script>
</body>
</html>
