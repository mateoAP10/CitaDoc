<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title id="pgTitle">CitaDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#07111F;--surface:#0D1B2E;--primary:#2F6BFF;--primary-soft:#8DB2FF;
      --text:#F4F7FB;--muted:#A9B4C7;--line:rgba(255,255,255,.08);
      --sans:'Inter',sans-serif;--serif:'Fraunces',serif;
      --sb:92px;
    }
    html,body{height:100%;background:var(--bg);font-family:var(--sans);color:var(--text);overflow:hidden}

    /* ── LAYOUT: sidebar + main ── */
    .v3-layout{
      display:grid;
      grid-template-columns:var(--sb) 1fr;
      grid-template-rows:1fr auto;
      height:100svh;
      position:relative;
    }

    /* ── SIDEBAR ── */
    .v3-sidebar{
      grid-row:1/-1;
      background:var(--surface);
      border-right:1px solid var(--line);
      display:flex;flex-direction:column;align-items:center;
      padding:calc(env(safe-area-inset-top,0px)+20px) 0 calc(env(safe-area-inset-bottom,0px)+20px);
      z-index:50;overflow:hidden;
      width:var(--sb);
      transition:width .42s cubic-bezier(.19,1,.22,1);
      position:relative;
    }
    .v3-sidebar.expanded{width:260px;align-items:flex-start;padding-left:24px;padding-right:24px}

    /* Monogram */
    .v3-mono{
      width:40px;height:40px;border-radius:12px;
      background:var(--primary);
      display:flex;align-items:center;justify-content:center;
      font-family:var(--serif);font-size:.88rem;font-weight:600;color:#fff;
      letter-spacing:-.02em;flex-shrink:0;margin-bottom:28px;
    }
    .v3-sidebar.expanded .v3-mono{width:44px;height:44px}

    /* Nav */
    .v3-nav{display:flex;flex-direction:column;gap:4px;width:100%;flex:1}
    .v3-nav-item{
      display:flex;align-items:center;gap:12px;
      width:42px;height:42px;border-radius:12px;
      border:none;background:transparent;cursor:pointer;
      color:var(--muted);font-family:var(--sans);font-size:.82rem;font-weight:500;
      transition:background .18s,color .18s;text-decoration:none;
      padding:0;justify-content:center;white-space:nowrap;overflow:hidden;
    }
    .v3-sidebar.expanded .v3-nav-item{width:100%;padding:0 10px;justify-content:flex-start}
    .v3-nav-item:hover{background:var(--line);color:var(--text)}
    .v3-nav-item.active{background:rgba(47,107,255,.15);color:var(--primary)}
    .v3-nav-item svg{flex-shrink:0}
    .v3-nav-label{display:none;font-size:.82rem}
    .v3-sidebar.expanded .v3-nav-label{display:block}

    /* Expand button */
    .v3-expand-btn{
      width:42px;height:42px;border-radius:14px;
      background:rgba(255,255,255,.06);border:1px solid var(--line);
      backdrop-filter:blur(20px);color:var(--muted);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;letter-spacing:.1em;margin-top:auto;flex-shrink:0;
      transition:background .2s;
    }
    .v3-expand-btn:hover{background:rgba(255,255,255,.1)}

    /* ── MAIN SCENE ── */
    .v3-main{
      position:relative;overflow:hidden;
      grid-column:2;grid-row:1;
    }
    .v3-photo{position:absolute;inset:0}
    .v3-photo img{width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block;filter:brightness(.75) contrast(1.05)}
    .v3-photo-ov{
      position:absolute;inset:0;
      background:linear-gradient(90deg,rgba(7,17,31,.85) 0%,rgba(7,17,31,.5) 45%,rgba(7,17,31,.15) 100%),
                 linear-gradient(0deg,rgba(7,17,31,.8) 0%,transparent 50%);
    }
    .v3-content{
      position:relative;z-index:10;
      height:100%;display:flex;flex-direction:column;justify-content:flex-end;
      padding:24px 28px calc(16px);
    }
    .v3-doctor-info{margin-bottom:16px}
    .v3-doctor-name{font-size:.6rem;font-weight:700;color:var(--primary-soft);text-transform:uppercase;letter-spacing:.18em;margin-bottom:3px}
    .v3-doctor-esp{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
    .v3-headline{
      font-family:var(--serif);
      font-size:clamp(1.6rem,4vw,2.4rem);
      font-weight:300;line-height:1.18;
      letter-spacing:-.02em;color:var(--text);
      margin-bottom:14px;
    }
    .v3-headline em{font-style:italic;color:var(--primary-soft)}
    .v3-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
    .v3-tag{
      padding:.25rem .7rem;border-radius:50px;
      border:1px solid var(--line);background:rgba(255,255,255,.05);
      font-size:.62rem;font-weight:500;color:var(--muted);
    }
    .v3-ctas{display:flex;gap:10px;align-items:center}
    .v3-btn-book{
      height:44px;padding:0 1.4rem;border-radius:12px;border:none;
      background:linear-gradient(180deg,#3478FF 0%,#2157D8 100%);
      color:#fff;font-family:var(--sans);font-size:.82rem;font-weight:700;
      cursor:pointer;display:flex;align-items:center;gap:7px;
      box-shadow:0 8px 24px rgba(47,107,255,.35);transition:opacity .2s;
    }
    .v3-btn-book:hover{opacity:.9}
    .v3-btn-more{
      font-size:.8rem;font-weight:500;color:var(--muted);
      background:none;border:none;cursor:pointer;padding:.5rem 0;
      text-decoration:none;transition:color .2s;
    }
    .v3-btn-more:hover{color:var(--text)}

    /* ── QUICK ACTIONS STRIP ── */
    .v3-quick-actions{
      grid-column:2;grid-row:2;
      background:var(--surface);border-top:1px solid var(--line);
      display:flex;gap:0;padding:0;
      padding-bottom:env(safe-area-inset-bottom,0px);
    }
    .v3-qa-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;padding:14px 8px;border:none;background:transparent;cursor:pointer;
      border-right:1px solid var(--line);transition:background .18s;
    }
    .v3-qa-btn:last-child{border-right:none}
    .v3-qa-btn:hover{background:rgba(255,255,255,.04)}
    .v3-qa-icon{font-size:1rem;margin-bottom:2px}
    .v3-qa-label{font-size:.62rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

    /* Footer strip */
    .v3-footer-strip{
      grid-column:1/-1;
      padding:.6rem 20px;display:flex;align-items:center;justify-content:center;
      border-top:1px solid var(--line);
    }
    .v3-footer-text{font-size:.6rem;color:rgba(255,255,255,.2)}
    .v3-footer-text a{color:rgba(255,255,255,.35);text-decoration:none;font-weight:600}

    /* ── MOBILE ── */
    @media(max-width:680px){
      .v3-layout{grid-template-columns:0 1fr;grid-template-rows:1fr auto}
      .v3-sidebar{
        position:fixed;top:0;bottom:0;left:0;
        width:280px;transform:translateX(-100%);
        transition:transform .42s cubic-bezier(.19,1,.22,1);
        padding:calc(env(safe-area-inset-top,0px)+20px) 24px 24px;
        align-items:flex-start;
      }
      .v3-sidebar.open{transform:translateX(0)}
      .v3-sidebar .v3-nav-item{width:100%;padding:0 10px;justify-content:flex-start}
      .v3-sidebar .v3-nav-label{display:block}
      .v3-main{grid-column:1/-1}
      .v3-quick-actions{grid-column:1/-1}
      .v3-mobile-menu{
        position:fixed;top:calc(env(safe-area-inset-top,0px)+14px);left:16px;z-index:60;
        width:42px;height:42px;border-radius:14px;
        background:rgba(13,27,46,.85);backdrop-filter:blur(16px);
        border:1px solid var(--line);color:var(--text);cursor:pointer;
        display:flex;align-items:center;justify-content:center;font-size:1rem;
      }
      .v3-sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;backdrop-filter:blur(2px)}
      .v3-sidebar-overlay.show{display:block}
    }
    @media(min-width:681px){.v3-mobile-menu{display:none}}
  </style>
</head>
<body>

<!-- Mobile hamburger -->
<button class="v3-mobile-menu" onclick="toggleSidebar()">≡</button>
<div class="v3-sidebar-overlay" id="v3Overlay" onclick="toggleSidebar()"></div>

<div class="v3-layout">
  <!-- SIDEBAR -->
  <aside class="v3-sidebar" id="v3Sidebar">
    <div class="v3-mono" id="v3Mono">MA</div>

    <nav class="v3-nav">
      <a class="v3-nav-item active" href="#">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        <span class="v3-nav-label">Inicio</span>
      </a>
      <a class="v3-nav-item" href="#">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="v3-nav-label">Sobre mí</span>
      </a>
      <a class="v3-nav-item" href="#">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span class="v3-nav-label">Servicios</span>
      </a>
      <a class="v3-nav-item" href="#">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span class="v3-nav-label">Resultados</span>
      </a>
      <a class="v3-nav-item" href="#">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        <span class="v3-nav-label">Formación</span>
      </a>
      <a class="v3-nav-item" href="#">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span class="v3-nav-label">Contacto</span>
      </a>
    </nav>

    <button class="v3-expand-btn" onclick="toggleExpand()">···</button>
  </aside>

  <!-- MAIN SCENE -->
  <main class="v3-main">
    <div class="v3-photo">
      <img id="v3Photo" src="" alt="Doctor">
      <div class="v3-photo-ov"></div>
    </div>
    <div class="v3-content">
      <div class="v3-doctor-info">
        <div class="v3-doctor-name" id="v3DoctorName">DR. MÉDICO</div>
        <div class="v3-doctor-esp" id="v3DoctorEsp">Especialidad · Ciudad</div>
      </div>
      <h1 class="v3-headline" id="v3Headline">Excelencia que transforma<br><em>confianza en ti.</em></h1>
      <div class="v3-tags" id="v3Tags"></div>
      <div class="v3-ctas">
        <button class="v3-btn-book" onclick="abrirBooking&&abrirBooking()">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Agendar cita
        </button>
        <a class="v3-btn-more" id="v3WaLink" href="#" target="_blank" rel="noopener" style="display:none">WhatsApp →</a>
      </div>
    </div>
  </main>

  <!-- QUICK ACTIONS -->
  <div class="v3-quick-actions">
    <button class="v3-qa-btn" onclick="document.querySelector('.v3-nav-item:nth-child(3)').click()">
      <span class="v3-qa-icon">⚕️</span>
      <span class="v3-qa-label">Procedimientos</span>
    </button>
    <button class="v3-qa-btn">
      <span class="v3-qa-icon">📈</span>
      <span class="v3-qa-label">Resultados</span>
    </button>
    <button class="v3-qa-btn">
      <span class="v3-qa-icon">💬</span>
      <span class="v3-qa-label">Testimonios</span>
    </button>
    <div class="v3-footer-strip" style="display:none" id="v3Footer">
      <span class="v3-footer-text">Powered by <a href="https://citadoc.lat" target="_blank" rel="noopener">CitaDoc Health Network</a></span>
    </div>
  </div>
</div>

<!-- Footer en desktop -->
<div style="position:fixed;bottom:0;left:var(--sb);right:0;padding:.5rem;text-align:center;border-top:1px solid var(--line);background:var(--surface);z-index:5">
  <span style="font-size:.6rem;color:rgba(255,255,255,.18)">Powered by <a href="https://citadoc.lat" target="_blank" style="color:rgba(255,255,255,.3);text-decoration:none;font-weight:600">CitaDoc Health Network</a></span>
</div>

<script>
var expanded=false,mobileOpen=false;
function toggleExpand(){
  expanded=!expanded;
  document.getElementById('v3Sidebar').classList.toggle('expanded',expanded);
}
function toggleSidebar(){
  mobileOpen=!mobileOpen;
  document.getElementById('v3Sidebar').classList.toggle('open',mobileOpen);
  document.getElementById('v3Overlay').classList.toggle('show',mobileOpen);
}

var _sb=supabase.createClient('https://qxoomcqaafogczrvsyhg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4b29tY3FhYWZvZ2N6cnZzeWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDAyMzgsImV4cCI6MjA5Mjk3NjIzOH0.HRer4Z0vx1sNbxpZelIiHOqdGwSgpykEOZM5p2To2Vs');
var slug=new URLSearchParams(location.search).get('slug');
function el(id){return document.getElementById(id)}
function set(id,v){var e=el(id);if(e)e.textContent=v}

if(slug){_sb.from('medicos').select('*').eq('slug',slug).eq('activo',true).single().then(function(r){
  if(r.error||!r.data)return;
  var m=r.data,wc=m.web_config||{},n=(m.titulo||'Dr.')+' '+m.nombre+' '+m.apellido,esp=(m.especialidades||[])[0]||'',ciudad=m.ciudad||'',photo=wc.doctor_photo_url||m.foto_url||'',logo=wc.logo_url||null,waActive=m.whatsapp_activo&&m.whatsapp,waUrl=waActive?'https://wa.me/'+m.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent('Hola '+n+', quiero agendar.'):'';
  document.title=n+' — CitaDoc';
  var mono=el('v3Mono');if(mono){var ini=((m.nombre||'')[0]||'').toUpperCase()+((m.apellido||'')[0]||'').toUpperCase();if(logo){mono.innerHTML='<img src="'+logo+'" style="height:28px;max-width:60px;object-fit:contain;filter:brightness(0) invert(1)">';}else{mono.textContent=ini;}}
  var img=el('v3Photo');if(img&&photo)img.src=photo;
  set('v3DoctorName',n.toUpperCase());set('v3DoctorEsp',(esp+(ciudad?' · '+ciudad:'')).toUpperCase());
  set('v3Headline',wc.headline||'Excelencia que transforma confianza en ti.');
  el('v3Headline').innerHTML=(wc.headline||'Excelencia que transforma <em>confianza en ti.</em>');
  var tags=(m.especialidades||[]).concat(wc.differentiators||[]).slice(0,4);
  var tg=el('v3Tags');if(tg)tg.innerHTML=tags.map(function(t){return'<span class="v3-tag">'+t+'</span>';}).join('');
  if(waActive&&waUrl){var wl=el('v3WaLink');if(wl){wl.href=waUrl;wl.style.display='block';wl.textContent='WhatsApp →';}}
});}
</script>
</body>
</html>
