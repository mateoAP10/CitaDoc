<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CitaDoc — Activar Plan</title>
<script type="module" src="https://cdn.payphonetodoesposible.com/box/v1.1/payphone-payment-box.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #F5F3EF;
  --card:   #FFFFFF;
  --ink:    #111827;
  --sub:    #6B7280;
  --line:   #E8E4DC;
  --green:  #1B5E42;
  --green2: #E6F2EC;
  --r:      16px;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─── TOPBAR ─── */
.topbar {
  width: 100%;
  padding: 1.1rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: var(--card);
  flex-shrink: 0;
}
.logo { font-size: 1rem; font-weight: 800; letter-spacing: -.03em; }
.logo em { color: var(--green); font-style: normal; }
.secure {
  display: flex; align-items: center; gap: .4rem;
  font-size: .72rem; color: var(--sub); font-weight: 500;
}
.secure svg { width: 13px; height: 13px; fill: var(--green); opacity: .7; }

/* ─── MAIN ─── */
.main {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 3rem 1.5rem 4rem;
  gap: 2rem;
}

/* ─── LEFT: plan summary ─── */
.plan-col {
  width: 340px;
  flex-shrink: 0;
}

.plan-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: 0 1px 8px rgba(0,0,0,.05);
}

.plan-top {
  background: var(--green);
  padding: 1.6rem 1.75rem 1.4rem;
}
.plan-badge {
  display: inline-block;
  background: rgba(255,255,255,.15);
  color: #fff;
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .25rem .65rem;
  border-radius: 999px;
  margin-bottom: .85rem;
}
.plan-label {
  font-size: 1.3rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: -.02em;
  margin-bottom: .2rem;
}
.plan-sub {
  font-size: .8rem;
  color: rgba(255,255,255,.7);
  line-height: 1.45;
}

.plan-bottom {
  padding: 1.4rem 1.75rem;
}
.price-row {
  display: flex;
  align-items: baseline;
  gap: .5rem;
  padding-bottom: 1.1rem;
  margin-bottom: 1.1rem;
  border-bottom: 1px solid var(--line);
}
.price-amount {
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: -.04em;
  color: var(--ink);
}
.price-note {
  font-size: .78rem;
  color: var(--sub);
  line-height: 1.4;
}

.features { display: flex; flex-direction: column; gap: .55rem; }
.feat {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  font-size: .8rem;
  color: #374151;
  line-height: 1.4;
}
.feat-check {
  width: 16px; height: 16px;
  background: var(--green2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: .05rem;
}
.feat-check svg { width: 9px; height: 9px; stroke: var(--green); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

.plan-name-tag {
  margin-top: 1.1rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--line);
  font-size: .75rem;
  color: var(--sub);
  font-style: italic;
}
.plan-name-tag strong { color: var(--ink); font-style: normal; font-weight: 600; }

/* ─── RIGHT: widget ─── */
.widget-col {
  flex: 1;
  min-width: 0;
  max-width: 520px;
}

.widget-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: 0 1px 8px rgba(0,0,0,.05);
}
.widget-head {
  padding: 1.25rem 1.75rem;
  border-bottom: 1px solid var(--line);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--sub);
}
.widget-body {
  padding: 0;
}
#pp-pay-container {
  min-height: 260px;
}

/* Loading */
.pp-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .85rem;
  padding: 3rem 2rem;
  color: var(--sub);
  font-size: .82rem;
}
.spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--line);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Error */
.pp-error {
  display: none;
  margin: 1rem 1.5rem;
  background: #FEF2F2;
  border: 1px solid #FEE2E2;
  border-radius: 10px;
  padding: .9rem 1.1rem;
  font-size: .8rem;
  color: #991B1B;
}

/* ─── FOOTER ─── */
.pay-footer {
  flex-shrink: 0;
  padding: 1.25rem 2rem;
  border-top: 1px solid var(--line);
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  font-size: .7rem;
  color: var(--sub);
}
.pay-footer span { display: flex; align-items: center; gap: .3rem; }

/* ─── MOBILE ─── */
@media (max-width: 760px) {
  .topbar { padding: .9rem 1.1rem; }
  .main {
    flex-direction: column;
    padding: 1.5rem 1rem 3rem;
    gap: 1rem;
    align-items: stretch;
  }
  .plan-col { width: 100%; }
  .widget-col { max-width: 100%; }
  .pay-footer { flex-wrap: wrap; gap: .75rem; padding: 1rem; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Cita<em>Doc</em></div>
  <div class="secure">
    <svg viewBox="0 0 16 16"><path d="M8 1L2 3.5V8c0 3.3 2.5 6.4 6 7 3.5-.6 6-3.7 6-7V3.5L8 1z"/></svg>
    Pago seguro · SSL
  </div>
</div>

<div class="main">

  <!-- Plan summary -->
  <div class="plan-col">
    <div class="plan-card">
      <div class="plan-top">
        <div class="plan-badge" id="planBadge">PRO+WEB</div>
        <div class="plan-label" id="planLabel">CitaDoc PRO+WEB</div>
        <div class="plan-sub" id="planSub">Sitio web médico con IA + agenda + gestión de pacientes</div>
      </div>
      <div class="plan-bottom">
        <div class="price-row">
          <div class="price-amount" id="priceAmount">$150</div>
          <div class="price-note" id="priceNote">activación<br>del sitio web</div>
        </div>
        <div class="features" id="featureList"></div>
        <div class="plan-name-tag" id="planNameTag" style="display:none">
          Para: <strong id="doctorName"></strong>
        </div>
      </div>
    </div>
  </div>

  <!-- Payment widget -->
  <div class="widget-col">
    <div class="widget-card">
      <div class="widget-head">Método de pago</div>
      <div class="widget-body">
        <div id="pp-pay-container">
          <div class="pp-loading">
            <div class="spinner"></div>
            Iniciando pasarela de pago…
          </div>
        </div>
        <div class="pp-error" id="ppError"></div>
      </div>
    </div>
  </div>

</div>

<div class="pay-footer">
  <span>
    <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L2 3.5V8c0 3.3 2.5 6.4 6 7 3.5-.6 6-3.7 6-7V3.5L8 1z"/></svg>
    Procesado por PayPhone
  </span>
  <span>Datos encriptados · PCI DSS</span>
  <span><a href="https://citadoc.lat" style="color:inherit">citadoc.lat</a></span>
</div>

<script>
(function () {
  var PAYPHONE_TOKEN   = 'qxqLAKFYxUUR8NoREmBHflZ2vLecsVPS4A79oHSV_ic4F08lj1Wyf6iQBsBNUW_oAOu5cU7XydOmnx2x21DYdpJEEst6Ro8Qp5heH1UcuFwlFrx3lqLXHCI8yJXqDd2iw8u0xE-_3JHlRNDL4Erve6mHpxkiuX8AC8FiBcWiUPci_i1kMG6oQ87p_Qh7wtx-nECVzxgSueh-eDIyEQdLgH2XlMPOqET26tHFIRE5gbVoQw7Ez9bTj758u-yIlFnGR7DGev99D4Pt-BCbEKxyJ1wxFMBIRRRaiLsMQQ4NjEpRvjVuTAPBzC0Z5DRNGUqa2YLZDg';
  var PAYPHONE_STOREID = '86e91007-666b-48c0-a752-3e62aa85b1ef';

  var sp       = new URLSearchParams(location.search);
  var plan     = sp.get('plan')   || 'pro_web';
  var medicoId = sp.get('medico') || '';
  var email    = sp.get('email')  || '';
  var name     = sp.get('name')   || '';

  var isWeb  = plan === 'pro_web';
  var amount = isWeb ? 15000 : 1999;

  var PLANS = {
    pro_web: {
      badge:    'PRO+WEB',
      label:    'CitaDoc PRO+WEB',
      sub:      'Sitio web médico con IA + agenda inteligente + gestión de pacientes',
      price:    '$150',
      note:     'activación\ndel sitio web',
      features: [
        'Sitio web médico generado con IA',
        'Dominio propio: tu-nombre.citadoc.lat',
        'Agenda online 24/7 para pacientes',
        'Recordatorios automáticos',
        'Panel de pacientes e historial'
      ]
    },
    pro: {
      badge:    'PRO',
      label:    'CitaDoc PRO',
      sub:      'Agenda inteligente + recordatorios + gestión de pacientes',
      price:    '$19.99',
      note:     'por mes',
      features: [
        'Agenda online 24/7 para pacientes',
        'Recordatorios automáticos por WhatsApp',
        'Panel de pacientes e historial clínico',
        'Reportes de citas'
      ]
    }
  };

  var p = PLANS[plan] || PLANS.pro_web;

  document.getElementById('planBadge').textContent   = p.badge;
  document.getElementById('planLabel').textContent   = p.label;
  document.getElementById('planSub').textContent     = p.sub;
  document.getElementById('priceAmount').textContent = p.price;
  document.getElementById('priceNote').innerHTML     = p.note.replace('\n', '<br>');

  var checkSvg = '<svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>';
  document.getElementById('featureList').innerHTML = p.features.map(function(f) {
    return '<div class="feat"><div class="feat-check">' + checkSvg + '</div>' + f + '</div>';
  }).join('');

  if (name) {
    document.getElementById('planNameTag').style.display = '';
    document.getElementById('doctorName').textContent = name;
  }

  // txId
  var shortId   = (medicoId || '').replace(/-/g, '').slice(0, 12);
  var shortPlan = isWeb ? 'pw' : 'pr';
  var txId      = ('cd-' + shortPlan + '-' + shortId + '-' + Date.now().toString(36)).slice(0, 50);

  var base      = 'https://citadoc.lat/citadoc-dashboard.html';
  var returnUrl = base + '?pp_return=1&pp_plan=' + encodeURIComponent(plan) + '&pp_tx=' + encodeURIComponent(txId);
  var cancelUrl = base + '?pp_cancel=1';

  function showError(msg) {
    document.getElementById('ppError').style.display = 'block';
    document.getElementById('ppError').textContent   = 'Error: ' + msg + '. Cierra esta ventana e intenta nuevamente.';
    document.getElementById('pp-pay-container').innerHTML = '';
  }

  function initWidget() {
    if (typeof PPaymentButtonBox === 'undefined') { setTimeout(initWidget, 150); return; }
    try {
      new PPaymentButtonBox({
        token:               PAYPHONE_TOKEN,
        storeId:             PAYPHONE_STOREID,
        clientTransactionId: txId,
        amount:              amount,
        amountWithoutTax:    amount,
        amountWithTax:       0,
        tax: 0, service: 0, tip: 0,
        currency:            'USD',
        reference:           'CitaDoc ' + p.badge + (medicoId ? ' | ' + medicoId : ''),
        lang:                'es',
        email:               email || undefined,
        responseUrl:         returnUrl,
        cancellationUrl:     cancelUrl,
        defaultMethod:       'card'
      }).render('pp-pay-container');
    } catch(e) {
      showError(e.message || 'Widget error');
    }
  }

  initWidget();
})();
</script>
</body>
</html>
