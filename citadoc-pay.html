<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CitaDoc — Activar Plan</title>
<script type="module" src="https://cdn.payphonetodoesposible.com/box/v1.1/payphone-payment-box.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F8F6F3;
    --surface: #FFFFFF;
    --ink: #1A1A1A;
    --muted: #6B7280;
    --border: #E5E0D8;
    --accent: #2D6A4F;
    --accent-light: #E8F5EE;
    --radius: 20px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 2rem 1rem 4rem;
    color: var(--ink);
  }

  /* ── Header ── */
  .pay-header {
    width: 100%;
    max-width: 460px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2.5rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .pay-logo {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--ink);
  }
  .pay-logo span { color: var(--accent); }
  .pay-secure {
    display: flex;
    align-items: center;
    gap: .35rem;
    font-size: .72rem;
    color: var(--muted);
    font-weight: 500;
  }
  .pay-secure svg { width: 12px; height: 12px; fill: var(--muted); }

  /* ── Plan Card ── */
  .plan-card {
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 12px rgba(0,0,0,.04);
  }
  .plan-badge {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    background: var(--accent-light);
    color: var(--accent);
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: .3rem .7rem;
    border-radius: 999px;
    margin-bottom: .9rem;
  }
  .plan-name {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: .25rem;
    letter-spacing: -.01em;
  }
  .plan-desc {
    font-size: .82rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 1.1rem;
  }
  .plan-price-row {
    display: flex;
    align-items: baseline;
    gap: .4rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
  .plan-price {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -.03em;
  }
  .plan-period {
    font-size: .78rem;
    color: var(--muted);
  }

  /* ── Benefits ── */
  .benefits {
    width: 100%;
    max-width: 460px;
    margin-bottom: 1.5rem;
  }
  .benefit {
    display: flex;
    align-items: center;
    gap: .65rem;
    padding: .5rem 0;
    font-size: .82rem;
    color: #374151;
  }
  .benefit-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ── Widget container ── */
  .widget-wrap {
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem 1.75rem;
    box-shadow: 0 2px 12px rgba(0,0,0,.04);
  }
  .widget-label {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* ── PayPhone widget overrides ── */
  payphone-button-box {
    --pp-primary: #2D6A4F;
    --pp-btn-radius: 12px;
  }

  /* ── Loading ── */
  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 2rem;
    color: var(--muted);
    font-size: .85rem;
  }
  .spinner {
    width: 24px;
    height: 24px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ── */
  .error-state {
    display: none;
    background: #FEF2F2;
    border: 1px solid #FEE2E2;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    font-size: .82rem;
    color: #991B1B;
    margin-top: 1rem;
    width: 100%;
    max-width: 460px;
  }

  /* ── Footer ── */
  .pay-footer {
    margin-top: 2rem;
    font-size: .72rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
  }
  .pay-footer a { color: var(--muted); }

  @media (max-width: 480px) {
    body { padding: 1.5rem .75rem 3rem; }
    .pay-header, .plan-card, .benefits, .widget-wrap { max-width: 100%; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="pay-header">
  <div class="pay-logo">Cita<span>Doc</span></div>
  <div class="pay-secure">
    <svg viewBox="0 0 16 16"><path d="M8 1L2 3.5V8c0 3.3 2.5 6.4 6 7 3.5-.6 6-3.7 6-7V3.5L8 1z"/></svg>
    Pago seguro
  </div>
</div>

<!-- Plan Card -->
<div class="plan-card" id="planCard">
  <div class="loading-state">
    <div class="spinner"></div>
    Cargando detalles del plan…
  </div>
</div>

<!-- Benefits -->
<div class="benefits" id="benefitsList" style="display:none"></div>

<!-- PayPhone Widget -->
<div class="widget-wrap">
  <div class="widget-label">Método de pago</div>
  <div id="pp-pay-container">
    <div class="loading-state">
      <div class="spinner"></div>
      Iniciando pasarela de pago…
    </div>
  </div>
</div>

<!-- Error -->
<div class="error-state" id="errState"></div>

<!-- Footer -->
<div class="pay-footer">
  Procesado por PayPhone · Datos encriptados SSL<br>
  <a href="https://citadoc.lat">citadoc.lat</a>
</div>

<script>
(function () {
  var PAYPHONE_TOKEN   = 'qxqLAKFYxUUR8NoREmBHflZ2vLecsVPS4A79oHSV_ic4F08lj1Wyf6iQBsBNUW_oAOu5cU7XydOmnx2x21DYdpJEEst6Ro8Qp5heH1UcuFwlFrx3lqLXHCI8yJXqDd2iw8u0xE-_3JHlRNDL4Erve6mHpxkiuX8AC8FiBcWiUPci_i1kMG6oQ87p_Qh7wtx-nECVzxgSueh-eDIyEQdLgH2XlMPOqET26tHFIRE5gbVoQw7Ez9bTj758u-yIlFnGR7DGev99D4Pt-BCbEKxyJ1wxFMBIRRRaiLsMQQ4NjEpRvjVuTAPBzC0Z5DRNGUqa2YLZDg';
  var PAYPHONE_STOREID = '86e91007-666b-48c0-a752-3e62aa85b1ef';

  // ── Parse URL params ──
  var sp      = new URLSearchParams(location.search);
  var plan    = sp.get('plan') || 'pro_web';
  var medicoId = sp.get('medico') || '';
  var email   = sp.get('email') || '';
  var name    = sp.get('name') || '';

  var isWeb   = plan === 'pro_web';
  var amount  = isWeb ? 15000 : 1999;       // cents
  var label   = isWeb ? 'PRO+WEB' : 'PRO';
  var price   = isWeb ? '$150' : '$19.99';
  var period  = isWeb ? '/año' : '/mes';

  // ── Render plan card ──
  var planDescMap = {
    pro_web: 'Sitio web médico profesional + agenda inteligente + recordatorios automáticos + panel de pacientes',
    pro:     'Agenda inteligente + recordatorios automáticos + panel de pacientes'
  };
  var benefitsMap = {
    pro_web: [
      'Sitio web médico personalizado con IA',
      'Dominio propio: tu-nombre.citadoc.lat',
      'Agenda online para pacientes 24/7',
      'Recordatorios automáticos por WhatsApp',
      'Panel de gestión de pacientes',
      'Actualizaciones incluidas'
    ],
    pro: [
      'Agenda online para pacientes 24/7',
      'Recordatorios automáticos por WhatsApp',
      'Panel de gestión de pacientes',
      'Historial clínico digital'
    ]
  };

  document.getElementById('planCard').innerHTML =
    '<div class="plan-badge">✦ ' + label + '</div>' +
    '<div class="plan-name">CitaDoc ' + label + (name ? ' · ' + name : '') + '</div>' +
    '<div class="plan-desc">' + (planDescMap[plan] || '') + '</div>' +
    '<div class="plan-price-row">' +
      '<span class="plan-price">' + price + '</span>' +
      '<span class="plan-period">' + period + '</span>' +
    '</div>';

  var bl = document.getElementById('benefitsList');
  var bens = benefitsMap[plan] || [];
  if (bens.length) {
    bl.style.display = '';
    bl.innerHTML = bens.map(function(b) {
      return '<div class="benefit"><div class="benefit-dot"></div>' + b + '</div>';
    }).join('');
  }

  // ── Build txId ──
  var shortId = (medicoId || '').replace(/-/g, '').slice(0, 12);
  var shortPlan = isWeb ? 'pw' : 'pr';
  var txId = ('cd-' + shortPlan + '-' + shortId + '-' + Date.now().toString(36)).slice(0, 50);

  var baseUrl = 'https://citadoc.lat/citadoc-dashboard.html';
  var returnUrl = baseUrl + '?pp_return=1&pp_plan=' + encodeURIComponent(plan) + '&pp_tx=' + encodeURIComponent(txId);
  var cancelUrl = baseUrl + '?pp_cancel=1';

  // ── Init PayPhone widget ──
  var container = document.getElementById('pp-pay-container');

  function showError(msg) {
    var el = document.getElementById('errState');
    el.style.display = 'block';
    el.textContent = 'Error al cargar el pago: ' + msg + '. Cierra esta ventana y vuelve a intentarlo.';
    container.innerHTML = '';
  }

  // Poll until PPaymentButtonBox is available (module loads async)
  function initWidget() {
    if (typeof PPaymentButtonBox === 'undefined') {
      setTimeout(initWidget, 150);
      return;
    }
    try {
      new PPaymentButtonBox({
        token:               PAYPHONE_TOKEN,
        storeId:             PAYPHONE_STOREID,
        clientTransactionId: txId,
        amount:              amount,
        amountWithoutTax:    amount,
        amountWithTax:       0,
        tax:                 0,
        service:             0,
        tip:                 0,
        currency:            'USD',
        reference:           'CitaDoc ' + label + (medicoId ? ' | ' + medicoId : ''),
        lang:                'es',
        email:               email || undefined,
        responseUrl:         returnUrl,
        cancellationUrl:     cancelUrl,
        defaultMethod:       'card'
      }).render('pp-pay-container');
    } catch(e) {
      showError(e.message || 'Widget error');
    }
  }

  initWidget();
})();
</script>
</body>
</html>
